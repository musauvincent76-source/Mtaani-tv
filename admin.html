<script>
let videos=[], videosByCat={news:[],bizz:[],mchezo:[],music:[],drama:[],gen:[]}, catEnabled={news:true,bizz:true,mchezo:true,music:true,drama:true,gen:true}, ads=[], ownerData={};
const bgMap={city1:'https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=1200',city2:'https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=1200',city3:'https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=1200',city4:'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1200',city5:'https://images.unsplash.com/photo-1514565131-fce0801e5785?w=1200',city6:'https://images.unsplash.com/photo-1444723121867-7a241cacace9?w=1200',city7:'https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1200',city8:'https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=1200',city9:'https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=1200',news1:'https://images.unsplash.com/photo-1495020689067-958852a7765e?w=1200',talk:'https://images.unsplash.com/photo-1515187029135-18ee286d815b?w=1200',studio:'https://images.unsplash.com/photo-1590602847861-f357a9f6a35f?w=1200',crowd:'https://images.unsplash.com/photo-1517457373958-b7bdd4587205?w=1200',street2:'https://images.unsplash.com/photo-1514565131-fce0801e5785?w=1200'};

function showTab(id,btnId){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');if(btnId)document.getElementById(btnId).classList.add('active');}
function openVCat(cat,btnId){document.querySelectorAll('[id^=vcat-]').forEach(b=>b.classList.remove('active'));document.getElementById('vcat-'+cat).classList.add('active');document.querySelectorAll('[id^=vc-]').forEach(b=>b.classList.remove('active'));if(btnId)document.getElementById(btnId).classList.add('active');}
function extractID(t){if(!t)return null;t=t.trim();if(/^[a-zA-Z0-9_-]{11}$/.test(t))return t;let m=t.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);if(m)return m[1];try{let u=new URL(t);let v=u.searchParams.get('v');if(v)return v;}catch{}return null;}
async function fetchTitle(){let id=extractID(document.getElementById('link').value);if(!id)return;try{let r=await fetch('https://noembed.com/embed?url=https://www.youtube.com/watch?v='+id);let d=await r.json();if(d.title)document.getElementById('title').value=d.title;}catch{}}
async function fetchTitleCat(cat){let id=extractID(document.getElementById('link-'+cat).value);if(!id)return;try{let r=await fetch('https://noembed.com/embed?url=https://www.youtube.com/watch?v='+id);let d=await r.json();if(d.title)document.getElementById('title-'+cat).value=d.title;}catch{}}
function autoSaveToken(v){try{if(v.trim().length>10){localStorage.setItem('gh_token',v.trim());sessionStorage.setItem('gh_token',v.trim());localStorage.setItem('gh_token_backup',v.trim());document.cookie='gh_token='+encodeURIComponent(v.trim())+'; max-age=31536000; path=/';}}catch(e){}}
function saveToken(){let t=document.getElementById('token').value.trim();if(t.length<10){alert('Weka token');return;}try{localStorage.setItem('gh_token',t);sessionStorage.setItem('gh_token',t);localStorage.setItem('gh_token_backup',t);document.cookie='gh_token='+encodeURIComponent(t)+'; max-age=31536000; path=/';localStorage.setItem('gh_owner',document.getElementById('owner').value);localStorage.setItem('gh_repo',document.getElementById('repo').value);}catch(e){}document.getElementById('tokenStatus').innerHTML='<span class="ok">✅ Imehifadhiwa! Haitoki tena!</span>';}
function loadToken(){let s='';try{s=localStorage.getItem('gh_token')||'';}catch(e){}if(!s){try{s=sessionStorage.getItem('gh_token')||'';}catch(e){}}if(!s){try{s=localStorage.getItem('gh_token_backup')||'';}catch(e){}}if(!s){try{let m=document.cookie.match(/gh_token=([^;]+)/);if(m)s=decodeURIComponent(m[1]);}catch(e){}}document.getElementById('token').value=s;try{document.getElementById('owner').value=localStorage.getItem('gh_owner')||'musauvincent76-source';document.getElementById('repo').value=localStorage.getItem('gh_repo')||'Mtaani-tv';}catch(e){}document.getElementById('tokenStatus').innerHTML=s?'<span class="ok">✅ Token ipo ('+s.slice(0,8)+'...)</span>':'<span class="warn">Weka token</span>';}
function saveLocal(){localStorage.setItem('mtaani_videos',JSON.stringify(videos));Object.keys(videosByCat).forEach(c=>localStorage.setItem('mtaani_videos_'+c,JSON.stringify(videosByCat[c])));localStorage.setItem('mtaani_cat_enabled',JSON.stringify(catEnabled));localStorage.setItem('mtaani_ads',JSON.stringify(ads));localStorage.setItem('mtaani_owner',JSON.stringify(ownerData));let all=[...videos];Object.keys(videosByCat).forEach(cat=>{if(catEnabled[cat])videosByCat[cat].forEach(v=>all.push(v));});document.getElementById('out').value=JSON.stringify(all,null,2);}
function renderVideos(){let h="";videos.forEach((v,i)=>{h+=`<div class="list-item"><span><b>${v.title}</b></span><button class="red" onclick="videos.splice(${i},1);saveLocal();renderVideos()">X</button></div>`});document.getElementById('vlist').innerHTML=h||"Hakuna";saveLocal();}
function renderVideosCat(cat){let h="";videosByCat[cat].forEach((v,i)=>{h+=`<div class="list-item"><span><b>${v.title}</b></span><button class="red" onclick="videosByCat['${cat}'].splice(${i},1);saveLocal();renderVideosCat('${cat}')">X</button></div>`});document.getElementById('vlist-'+cat).innerHTML=h||"Hakuna";saveLocal();}
function renderAds(){let h="";ads.forEach((a,i)=>{h+=`<div class="list-item"><span><b>${a.title}</b></span><button class="red" onclick="ads.splice(${i},1);saveLocal();renderAds()">X</button></div>`});document.getElementById('alist').innerHTML=h||"Hakuna";saveLocal();}
function addVideo(){let id=extractID(document.getElementById('link').value.trim());if(!id){alert("Link mbaya");return;}let title=document.getElementById('title').value.trim()||"MTAANI TV - "+id;videos.push({id:id,title:title});document.getElementById('link').value="";document.getElementById('title').value="";renderVideos();}
function addVideoCat(cat){let id=extractID(document.getElementById('link-'+cat).value.trim());if(!id){alert("Link mbaya");return;}let title=document.getElementById('title-'+cat).value.trim()||cat.toUpperCase()+" - "+id;videosByCat[cat].push({id:id,title:title,category:cat});document.getElementById('link-'+cat).value="";document.getElementById('title-'+cat).value="";renderVideosCat(cat);}

// HII NDIO FIX YA BUTTON ON/OFF - SASA INAFANYA KAZI 100%
function toggleCatEnabled(cat){
  catEnabled[cat]=!catEnabled[cat];
  let btn=document.getElementById('en-'+cat);
  if(btn){
    btn.innerText=cat.toUpperCase()+': '+(catEnabled[cat]?'ON':'OFF');
    btn.style.background=catEnabled[cat]?'#00b300':'#cc0000';
  }
  localStorage.setItem('mtaani_cat_enabled',JSON.stringify(catEnabled));
  saveLocal();
}

function updateCatButtons(){
  Object.keys(catEnabled).forEach(cat=>{
    let btn=document.getElementById('en-'+cat);
    if(btn){
      btn.innerText=cat.toUpperCase()+': '+(catEnabled[cat]?'ON':'OFF');
      btn.style.background=catEnabled[cat]?'#00b300':'#cc0000';
    }
  });
}

function addAd(){ads.push({title:document.getElementById('adTitle').value,msg:document.getElementById('adMsg').value});renderAds();}
function saveOwner(){ownerData={tvName:document.getElementById('tvName').value,ownerName:document.getElementById('ownerName').value,ticker:document.getElementById('ticker').value};localStorage.setItem('mtaani_owner',JSON.stringify(ownerData));document.getElementById('ownerStatus').innerHTML='<span class="ok">✅ Saved</span>';}
function loadAll(){try{let v=localStorage.getItem('mtaani_videos');if(v)videos=JSON.parse(v);}catch{}Object.keys(videosByCat).forEach(c=>{try{let vv=localStorage.getItem('mtaani_videos_'+c);if(vv)videosByCat[c]=JSON.parse(vv);}catch{}});try{let ce=localStorage.getItem('mtaani_cat_enabled');if(ce)catEnabled=JSON.parse(ce);}catch{}try{let a=localStorage.getItem('mtaani_ads');if(a)ads=JSON.parse(a);}catch{}renderVideos();Object.keys(videosByCat).forEach(c=>renderVideosCat(c));renderAds();loadToken();updateCatButtons();}
loadAll();
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
async function pushFile(fn,content){let token='';try{token=localStorage.getItem('gh_token')||sessionStorage.getItem('gh_token')||localStorage.getItem('gh_token_backup')||'';}catch(e){}if(!token){try{let m=document.cookie.match(/gh_token=([^;]+)/);if(m)token=decodeURIComponent(m[1]);}catch(e){}}let owner=document.getElementById('owner').value;let repo=document.getElementById('repo').value;if(!token){document.getElementById('pushStatus').innerText="❌ Weka Token!";return false;}document.getElementById('pushStatus').innerText="⏳ Inatuma "+fn+"...";try{let url=`https://api.github.com/repos/${owner}/${repo}/contents/${fn}`;let sha=null;try{let r=await fetch(url,{headers:{Authorization:`token ${token}`}});if(r.ok){let j=await r.json();sha=j.sha;}}catch{}let res=await fetch(url,{method:'PUT',headers:{Authorization:`token ${token}`,"Content-Type":"application/json"},body:JSON.stringify({message:`Update ${fn}`,content:b64(content),sha:sha})});if(res.ok)return true;let d=await res.json();document.getElementById('pushStatus').innerText="❌ "+fn+": "+d.message;return false;}catch(e){document.getElementById('pushStatus').innerText="❌ "+e.message;return false;}}
async function pushAll(){let all=[...videos];Object.keys(videosByCat).forEach(c=>{if(catEnabled[c])videosByCat[c].forEach(v=>all.push(v));});let ok=await pushFile('videos.json',JSON.stringify(all,null,2));if(ok)document.getElementById('pushStatus').innerHTML='<span class="ok">✅ IMEENDA PUBLIC!</span>';}
function setBg(k){let layer=document.getElementById('bgLayer');let vid=document.getElementById('bgVideo');vid.style.display='none';vid.pause();document.querySelectorAll('.bg-thumb').forEach(t=>t.classList.remove('active'));if(document.getElementById('thumb-'+k))document.getElementById('thumb-'+k).classList.add('active');if(k==='anim'){layer.style.background='linear-gradient(45deg,#050a1f,#ff6600,#ffcc00,#111c44)';layer.style.display='block';}else{layer.style.backgroundImage=`url(${bgMap[k]})`;layer.style.backgroundSize='cover';layer.style.display='block';}}
</script>
</body>
