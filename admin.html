<script>
let videos=[], videosByCat={news:[],bizz:[],mchezo:[],music:[],drama:[],gen:[]}, catEnabled={news:false,bizz:false,mchezo:false,music:false,drama:false,gen:false}, ads=[], ownerData={tvName:"MTAANI TV",ownerName:"MTAANI TV",ticker:"MTAANI TV LIVE"}, currentFacing="user", currentRoom="MtaaniTV-Live-Show";
let liveEndTime=0, liveTimerInterval=null, autoStopTimeout=null;
function showTab(id,btnId){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');if(btnId)document.getElementById(btnId).classList.add('active');}
function openVCat(cat,btnId){document.querySelectorAll('[id^=vcat-]').forEach(b=>b.classList.remove('active'));document.getElementById('vcat-'+cat).classList.add('active');document.querySelectorAll('[id^=vc-]').forEach(b=>b.classList.remove('active'));if(btnId)document.getElementById(btnId).classList.add('active');}
function extractID(t){if(!t) return null; t=t.trim(); if(/^[a-zA-Z0-9_-]{11}$/.test(t)) return t; let m=t.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/); if(m) return m[1]; if(t.includes('facebook.com')||t.includes('fb.watch')) return t; try{let u=new URL(t);let v=u.searchParams.get('v');if(v)return v;}catch{} return t.length>5? t : null;}
async function fetchTitle(){let id=extractID(document.getElementById('link').value);if(!id||id.includes('facebook')){document.getElementById('title').value='Facebook Video';return;}try{let r=await fetch('https://noembed.com/embed?url=https://www.youtube.com/watch?v='+id);let d=await r.json();if(d.title)document.getElementById('title').value=d.title;}catch{}}
async function fetchTitleCat(cat){let id=extractID(document.getElementById('link-'+cat).value);if(!id) return; if(id.includes('facebook')||id.includes('fb.watch')){document.getElementById('title-'+cat).value='FB - '+cat.toUpperCase(); let s=document.getElementById('status-'+cat); if(s) s.innerHTML='<span class="ok">✅ FB Link Sawa</span>'; return;} try{let r=await fetch('https://noembed.com/embed?url=https://www.youtube.com/watch?v='+id);let d=await r.json();if(d.title){document.getElementById('title-'+cat).value=d.title;let s=document.getElementById('status-'+cat);if(s)s.innerHTML='<span class="ok">✅ '+d.title+'</span>';}}catch{}}
function saveToken(){let t=document.getElementById('token').value.trim();if(t.length<10){alert('Weka token');return;}localStorage.setItem('gh_token',t);localStorage.setItem('gh_owner',document.getElementById('owner').value);localStorage.setItem('gh_repo',document.getElementById('repo').value);document.getElementById('tokenStatus').innerHTML='<span class="ok">✅ Token Saved!</span>';}
function loadToken(){let s=localStorage.getItem('gh_token')||'';document.getElementById('token').value=s;document.getElementById('owner').value=localStorage.getItem('gh_owner')||'musauvincent76-source';document.getElementById('repo').value=localStorage.getItem('gh_repo')||'Mtaani-tv';}
function saveLocal(){localStorage.setItem('mtaani_videos',JSON.stringify(videos));Object.keys(videosByCat).forEach(c=>localStorage.setItem('mtaani_videos_'+c,JSON.stringify(videosByCat[c])));localStorage.setItem('mtaani_ads',JSON.stringify(ads));localStorage.setItem('mtaani_owner',JSON.stringify(ownerData));localStorage.setItem('mtaani_cat_enabled',JSON.stringify(catEnabled));}
function renderVideos(){let h="";videos.forEach((v,i)=>{h+=`<div class="list-item"><span><b>${v.title}</b></span><button class="red" onclick="videos.splice(${i},1);saveLocal();renderVideos()">X</button></div>`});document.getElementById('vlist').innerHTML=h||"Hakuna";updateCount('gen');saveLocal();}
function renderVideosCat(cat){let h="";videosByCat[cat].forEach((v,i)=>{h+=`<div class="list-item"><span><b>${v.title}</b><br><span class="small">${v.id.substring(0,40)}</span></span><button class="red" onclick="videosByCat['${cat}'].splice(${i},1);saveLocal();renderVideosCat('${cat}')">X</button></div>`});document.getElementById('vlist-'+cat).innerHTML=h||"Hakuna";updateCount(cat);saveLocal();}
function updateCount(cat){let c = cat==='gen'? videos.length : videosByCat[cat].length; let el = document.getElementById('count-'+cat); if(el){ el.innerText = c + ' video'; }}
function addVideo(){let id=extractID(document.getElementById('link').value.trim()); if(!id){alert("Link mbaya");return;} let title=document.getElementById('title').value.trim()||"MTAANI - "+id.substring(0,10); videos.push({id:id,title:title}); document.getElementById('link').value=""; document.getElementById('title').value=""; renderVideos();}
function addVideoCat(cat){let id=extractID(document.getElementById('link-'+cat).value.trim()); if(!id){alert("Link mbaya");return;} let title=document.getElementById('title-'+cat).value.trim()||cat.toUpperCase()+" - "+id.substring(0,15); videosByCat[cat].push({id:id,title:title,category:cat}); document.getElementById('link-'+cat).value=""; document.getElementById('title-'+cat).value=""; renderVideosCat(cat);}
function renderAds(){let h="";ads.forEach((a,i)=>{h+=`<div class="list-item"><span><b>${a.title}</b> - ${a.msg}</span><button class="red" onclick="ads.splice(${i},1);saveLocal();renderAds()">X</button></div>`});document.getElementById('alist').innerHTML=h||"Hakuna";saveLocal();}
function addAd(){ads.push({title:document.getElementById('adTitle').value,msg:document.getElementById('adMsg').value,contact:document.getElementById('adContact').value});renderAds();}
function saveOwner(){ownerData={tvName:document.getElementById('tvName').value,ownerName:document.getElementById('ownerName').value,ticker:document.getElementById('ticker').value};localStorage.setItem('mtaani_owner',JSON.stringify(ownerData));document.getElementById('ownerStatus').innerHTML='<span class="ok">✅ Saved</span>';}
function toggleCat(cat){catEnabled[cat]=!catEnabled[cat];let btn=document.getElementById('sw-'+cat);if(btn){btn.innerText=catEnabled[cat]? 'ON 🟢' : 'OFF 🔴';btn.style.background=catEnabled[cat]? '#00b300' : '#cc0000';}saveLocal();}
function loadAll(){try{let v=localStorage.getItem('mtaani_videos');if(v)videos=JSON.parse(v);}catch{} Object.keys(videosByCat).forEach(c=>{try{let vv=localStorage.getItem('mtaani_videos_'+c);if(vv)videosByCat[c]=JSON.parse(vv);}catch{}});try{let ce=localStorage.getItem('mtaani_cat_enabled');if(ce)catEnabled=JSON.parse(ce);}catch{} try{let a=localStorage.getItem('mtaani_ads');if(a)ads=JSON.parse(a);}catch{} try{let o=localStorage.getItem('mtaani_owner');if(o){ownerData=JSON.parse(o);document.getElementById('tvName').value=ownerData.tvName;document.getElementById('ownerName').value=ownerData.ownerName;document.getElementById('ticker').value=ownerData.ticker;}}catch{} renderVideos();Object.keys(videosByCat).forEach(c=>{renderVideosCat(c); let btn=document.getElementById('sw-'+c); if(btn){ btn.innerText=catEnabled[c]? 'ON 🟢' : 'OFF 🔴'; btn.style.background=catEnabled[c]? '#00b300' : '#cc0000'; } });renderAds();loadToken();}
loadAll();
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
async function pushFile(fn,content){let token=localStorage.getItem('gh_token')||''; let owner=document.getElementById('owner').value; let repo=document.getElementById('repo').value;if(!token){document.getElementById('pushStatus').innerText="❌ Weka Token!";return false;}document.getElementById('pushStatus').innerText="⏳ Inatuma "+fn+"...";try{let url=`https://api.github.com/repos/${owner}/${repo}/contents/${fn}`;let sha=null;try{let r=await fetch(url,{headers:{Authorization:`token ${token}`}});if(r.ok){let j=await r.json();sha=j.sha;}}catch{}let res=await fetch(url,{method:'PUT',headers:{Authorization:`token ${token}`,"Content-Type":"application/json"},body:JSON.stringify({message:`Update ${fn}`,content:b64(content),sha:sha})});if(res.ok)return true;let d=await res.json();document.getElementById('pushStatus').innerText="❌ "+d.message;return false;}catch(e){document.getElementById('pushStatus').innerText="❌ "+e.message;return false;}}
async function pushAll(){let all=[...videos];Object.keys(videosByCat).forEach(c=>{ if(catEnabled[c]){ videosByCat[c].forEach(v=>all.push(v)); } });let ok1=await pushFile('videos.json',JSON.stringify(all,null,2));let ok2=await pushFile('owner.json',JSON.stringify(ownerData,null,2));let ok3=await pushFile('categories.json',JSON.stringify(catEnabled,null,2));if(ok1&&ok2) document.getElementById('pushStatus').innerHTML='<span class="ok">✅ IMEENDA TV - ZILE UMEWASHA TU!</span>';}
function toggleFull(){document.getElementById('live').classList.toggle('fullscreen');}
function setBg(el,url){document.querySelectorAll('.bg-thumb').forEach(t=>t.classList.remove('active'));if(el)el.classList.add('active');document.getElementById('bgLayer').style.backgroundImage='url('+url+')';document.getElementById('bgLayer').style.display='block';document.getElementById('bgVideo').style.display='none';localStorage.setItem('live_bg',url);}
function setFilter(type){
 let layer=document.getElementById('bgLayer'); let jitsi=document.getElementById('jitsiContainer');
 if(type==='pic'){
  layer.style.filter='brightness(1.35) contrast(1.2) saturate(1.5) hue-rotate(-5deg)';
  jitsi.style.filter='brightness(1.28) contrast(1.18) saturate(1.35)';
  document.getElementById('studioWrap').style.filter='brightness(1.1) contrast(1.1)';
 }
 else if(type==='smart'){ layer.style.filter='brightness(1.25) contrast(1.25) saturate(1.3)'; jitsi.style.filter='brightness(1.15) contrast(1.15) saturate(1.1)'; }
 else if(type==='beauty'){ layer.style.filter='brightness(1.3) contrast(1.1) saturate(1.4)'; jitsi.style.filter='brightness(1.25) contrast(1.05) saturate(1.2)'; }
 else { layer.style.filter='none'; jitsi.style.filter='none'; document.getElementById('studioWrap').style.filter='none'; }
 localStorage.setItem('live_filter',type);
}
function switchCamera(){ currentFacing = currentFacing==='user'? 'environment' : 'user'; alert('📷 '+(currentFacing==='user'?'FRONT':'BACK')+'\nNdani ya Jitsi bonyeza ⋮ > Settings > Camera'); }
function genShareLink(){ let room=currentRoom; let link='https://musauvincent76-source.github.io/Mtaani-tv/live-join.html?room='+room; document.getElementById('shareLink').value=link; localStorage.setItem('live_room',room); return link;}
function copyShareLink(){ let l=document.getElementById('shareLink'); if(!l.value) genShareLink(); l.select(); document.execCommand('copy'); alert('✅ Link imecopy!\n'+l.value); }

// === 3 HRS AUTO STOP ===
function start3hrTimer(){
  clearInterval(liveTimerInterval);
  clearTimeout(autoStopTimeout);
  liveEndTime = Date.now() + (3*60*60*1000); // 3 hours
  localStorage.setItem('live_end', liveEndTime);
  document.getElementById('liveTimerDisplay').style.display='block';

  liveTimerInterval = setInterval(()=>{
    let left = liveEndTime - Date.now();
    if(left <= 0){
      clearInterval(liveTimerInterval);
      document.getElementById('liveTimerDisplay').innerText='⏹️ LIVE IMEISHA - 3 HRS';
      autoStopLive();
      return;
    }
    let h = Math.floor(left/3600000);
    let m = Math.floor((left%3600000)/60000);
    let s = Math.floor((left%60000)/1000);
    document.getElementById('liveTimerDisplay').innerText = `🔴 LIVE: ${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s left - AUTO STOP 3HRS`;
  },1000);

  autoStopTimeout = setTimeout(()=>{ autoStopLive(); }, 3*60*60*1000);
}

async function autoStopLive(){
  alert('⏹️ 3 HRS ZIMEISHA! LIVE INAZIMWA AUTOMATIC!');
  await pushLiveStatus(false);
  if(window.jitsiApi) try{window.jitsiApi.dispose();}catch{}
  document.getElementById('liveTimerDisplay').style.display='none';
  localStorage.removeItem('live_end');
  clearInterval(liveTimerInterval);
  clearTimeout(autoStopTimeout);
}

function startLive(){
 let room=currentRoom;
 let container=document.getElementById('jitsiContainer');
 container.style.display='block';
 if(window.jitsiApi)try{window.jitsiApi.dispose();}catch{}
 let opts={
  roomName:room,
  width:"100%",
  height:"100%",
  parentNode:container,
  configOverwrite:{
    prejoinPageEnabled:false,
    disableInviteFunctions:true,
    enableClosePage:false,
    disableDeepLinking:true,
    transcribingEnabled:false,
    dialOutCodesUrl:'',
    dialOutAuthUrl:'',
    disableProfile:true
  },
  interfaceConfigOverwrite:{
    SHOW_JITSI_WATERMARK:false,
    SHOW_WATERMARK_FOR_GUESTS:false,
    SHOW_CHROME_EXTENSION_BANNER:false,
    MOBILE_APP_PROMO:false,
    DISPLAY_WELCOME_PAGE_CONTENT:false,
    DISPLAY_WELCOME_FOOTER:false
  },
  userInfo:{displayName:"MTAANI TV HOST"}
 };
 window.jitsiApi=new JitsiMeetExternalAPI("meet.jit.si",opts);
 document.getElementById('live').classList.add('fullscreen');
 genShareLink();
 setFilter(localStorage.getItem('live_filter')||'pic');
 let bg=localStorage.getItem('live_bg'); if(bg) document.getElementById('bgLayer').style.backgroundImage='url('+bg+')';
 pushLiveStatus(true);
 start3hrTimer();
}
function startLiveCat(cat){ openVCat(cat,'vc-'+cat); showTab('live','btn-live'); currentRoom="MtaaniTV-"+cat.toUpperCase()+"-"+Date.now(); localStorage.setItem('live_room',currentRoom); startLive(); }
async function pushLiveStatus(isLive){
 let room=localStorage.getItem('live_room')||currentRoom;
 let bg=localStorage.getItem('live_bg')||'';
 let data={live:isLive, room:room, bg:bg, time:Date.now(), endTime:isLive?liveEndTime:0};
 await pushFile('live.json', JSON.stringify(data,null,2));
 document.getElementById('pushStatus').innerHTML = isLive? '<span class="ok">🔴 LIVE INAONEKANA PUBLIC TV! (3 HRS)</span>' : '<span class="ok">⏹️ LIVE IMEZIMWA PUBLIC</span>';
 if(!isLive){
   clearInterval(liveTimerInterval);
   clearTimeout(autoStopTimeout);
   document.getElementById('liveTimerDisplay').style.display='none';
   localStorage.removeItem('live_end');
 }
}
// resume timer if page reloaded
(function(){
  let savedEnd=localStorage.getItem('live_end');
  if(savedEnd){
    let left=parseInt(savedEnd)-Date.now();
    if(left>0){
      liveEndTime=parseInt(savedEnd);
      document.getElementById('liveTimerDisplay')?.style && (document.getElementById('liveTimerDisplay').style.display='block');
      start3hrTimer();
      // adjust
      liveEndTime=parseInt(savedEnd);
    } else {
      localStorage.removeItem('live_end');
    }
  }
})();
</script>
