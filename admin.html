<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTAANI TV - ADMIN SMART</title>
<style>
*{box-sizing:border-box}body{background:#0a1430;color:#fff;font-family:sans-serif;padding:15px}
h1{color:#ffcc00;text-align:center} .card{background:#111c44;padding:15px;border-radius:10px;margin:15px 0;border:1px solid #ff6600}
input{width:100%;padding:12px;border-radius:8px;border:none;margin:6px 0;font-size:16px} button{width:100%;padding:12px;background:#ff6600;color:#fff;border:none;border-radius:8px;font-weight:900;font-size:16px;margin-top:10px;cursor:pointer}
#list div{background:#000;padding:10px;margin:8px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.small{font-size:12px;color:#aaa}
</style></head><body>
<h1>MTAANI TV - ADMIN SMART</h1>

<div class="card">
<h3>➕ Ongeza Video</h3>
<input id="link" placeholder="Weka Link ya YouTube hapa..." onpaste="setTimeout(autoTitle,100)" oninput="autoTitle()" >
<input id="title" placeholder="Jina la Wimbo / Msanii - litajijaza yenyewe...">
<div id="status" class="small"></div>
<button onclick="addVideo()">💾 HIFADHI VIDEO</button>
<button onclick="testLive()" style="background:#0066ff">🔴 JARIBU KAMA NI LIVE</button>
</div>

<div class="card">
<h3>📋 Videos Zangu (<span id="count">0</span>)</h3>
<div id="list">Inapakia...</div>
<button onclick="saveAll()" style="background:green">⬆️ TUMA KWA TV (SAVE)</button>
</div>

<script>
let videos = [];

function extractID(t){
  if(!t) return null;
  t=t.trim();
  if(/^[a-zA-Z0-9_-]{11}$/.test(t)) return t;
  let m=t.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/live\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);
  if(m) return m[1];
  try{let u=new URL(t); let v=u.searchParams.get('v'); if(v&&v.length===11) return v;}catch{}
  let m2=t.match(/[a-zA-Z0-9_-]{11}/);
  return m2?m2[0]:null;
}

async function autoTitle(){
  let link = document.getElementById('link').value.trim();
  if(link.length < 5) return;
  let id = extractID(link);
  if(!id) return;
  document.getElementById('status').innerText = "⏳ Nachukua jina la video...";
  try{
    // Njia ya haraka ya kuchukua title bila API key
    let res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
    let data = await res.json();
    if(data.title){
      document.getElementById('title').value = data.title;
      document.getElementById('status').innerText = "✅ Jina limepatikana: " + data.title;
    }
  }catch(e){
    // fallback - kama oembed imekataa (CORS)
    try{
      let res2 = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`);
      let data2 = await res2.json();
      if(data2.title){
        document.getElementById('title').value = data2.title;
        document.getElementById('status').innerText = "✅ Jina limepatikana: " + data2.title;
      }
    }catch{
      document.getElementById('status').innerText = "⚠️ Andika jina mwenyewe, YouTube imelock";
    }
  }
}

function testLive(){
  let link = document.getElementById('link').value;
  let id = extractID(link);
  if(!id){alert("Weka link kwanza"); return;}
  alert("Hii link ID ni: " + id + "\nKama ni LIVE, itachukua sekunde 5-10 ku-load kwa TV juu YouTube inalock LIVE. Si kosa lako.");
}

function render(){
  let html="";
  videos.forEach((v,i)=>{
    html+=`<div><span><b>${v.title}</b><br><span class="small">${v.id}</span></span><button onclick="removeVid(${i})" style="width:auto;background:red;padding:6px 10px">X</button></div>`;
  });
  document.getElementById('list').innerHTML = html || "Hakuna video";
  document.getElementById('count').innerText = videos.length;
}

function addVideo(){
  let link = document.getElementById('link').value;
  let title = document.getElementById('title').value;
  let id = extractID(link);
  if(!id){alert("Link si sawa!"); return;}
  if(!title) title = "MTAANI TV - " + id;
  videos.push({id:id, url:link, title:title, duration:300});
  document.getElementById('link').value="";
  document.getElementById('title').value="";
  document.getElementById('status').innerText="";
  render();
}

function removeVid(i){videos.splice(i,1); render();}

async function loadExisting(){
  try{
    let r = await fetch('videos.json?v='+Date.now());
    let d = await r.json();
    if(Array.isArray(d)) videos = d.map(v=>({id:extractID(v.id||v.url||'')||v.id, title:v.title||"MTAANI TV", url:v.url||v.id, duration:v.duration||300})).filter(v=>v.id);
    render();
  }catch{render();}
}
loadExisting();

async function saveAll(){
  if(videos.length==0){alert("Ongeza video kwanza"); return;}
  let content = JSON.stringify(videos, null, 2);
  alert("Nakili hii na uweke kwa videos.json kwa GitHub:\n\n" + content + "\n\nKama uko na token ya GitHub, hii inge-save direct - but kwa sasa copy paste kwa videos.json");
  // Ukiona hii, unaenda GitHub videos.json, una-paste na una-save
}
</script>
</body></html>
