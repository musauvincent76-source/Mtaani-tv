<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTAANI ADMIN</title>
<style>
body{background:#111;color:#fff;font-family:Arial;padding:20px}
input{width:100%;padding:12px;margin:8px 0;background:#222;color:#fff;border:1px solid #444;border-radius:6px}
button{background:#ffcc00;color:#000;padding:12px 20px;border:none;border-radius:6px;font-weight:900;cursor:pointer;width:100%;margin-top:10px}
#list div{background:#222;padding:10px;margin:5px 0;border-radius:6px;display:flex;justify-content:space-between}
textarea{width:100%;height:120px;background:#000;color:#0f0;padding:10px}
</style>
</head>
<body>
<h2 style="color:#ffcc00">MTAANI TV - ADMIN</h2>
<input id="ytlink" placeholder="Weka Link ya YouTube hapa...">
<button onclick="addVideo()">+ ONGEZA VIDEO</button>
<input id="ticker" placeholder="Andika matangazo ya chini...">
<button onclick="saveTicker()">SAVE MATANGAZO</button>
<div id="list"></div>
<h3>Copy hii uende ui-paste kwenye videos.json:</h3>
<textarea id="jsonOut" readonly></textarea>
<button onclick="copyJson()">COPY JSON</button>
<a href="index.html" style="display:block;margin-top:20px;color:#ffcc00">→ RUDI LIVE TV</a>

<script>
let vids = JSON.parse(localStorage.getItem('mtaani_vids') || '[]');
let tickerText = localStorage.getItem('mtaani_ticker') || 'MTAANI TV LIVE | WhatsApp: 0751768763';
document.getElementById('ticker').value = tickerText;

function getId(url){
  let m=url.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/);
  return m?m[1]:url;
}
function addVideo(){
  let link=document.getElementById('ytlink').value.trim();
  if(!link) return;
  let id=getId(link);
  vids.push({id:id, duration:300});
  localStorage.setItem('mtaani_vids', JSON.stringify(vids));
  document.getElementById('ytlink').value='';
  render();
}
function render(){
  let list=document.getElementById('list');
  list.innerHTML='';
  vids.forEach((v,i)=>{
    let d=document.createElement('div');
    d.innerHTML=`<span>${i+1}. ${v.id}</span><span style="color:red;cursor:pointer" onclick="del(${i})">FUTA</span>`;
    list.appendChild(d);
  });
  document.getElementById('jsonOut').value=JSON.stringify(vids, null, 2);
}
function del(i){ vids.splice(i,1); localStorage.setItem('mtaani_vids', JSON.stringify(vids)); render(); }
function saveTicker(){
  let t=document.getElementById('ticker').value;
  localStorage.setItem('mtaani_ticker', t);
  alert('Matangazo yamehifadhiwa! Yataonekana LIVE mara moja.');
}
function copyJson(){ navigator.clipboard.writeText(document.getElementById('jsonOut').value); alert('Copied! Nenda GitHub > videos.json > Paste > Commit'); }
render();
</script>
</body>
</html>
