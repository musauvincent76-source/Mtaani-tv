<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTAANI ADMIN</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;padding:12px}.h{background:linear-gradient(90deg,#ff0000,#ff6600);padding:18px;border-radius:14px;text-align:center;font-weight:900;font-size:22px}.card{background:#141414;border:1px solid #222;border-radius:12px;padding:14px;margin:12px 0}input,textarea{width:100%;padding:12px;background:#000;border:1px solid #333;color:#fff;border-radius:8px;margin:6px 0}button{width:100%;padding:14px;border:0;border-radius:10px;font-weight:900;margin-top:8px}.y{background:#ffcc00;color:#000}.w{background:#fff;color:#000}.r{background:#ff0000;color:#fff}.g{background:#00ff88;color:#000}.item{background:#1e1e1e;padding:10px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between}</style></head><body>
<div class="h">🔥 MTAANI TV ADMIN 🔥</div>
<div class="card" style="border:2px solid #fff"><button class="w" onclick="location.href='index.html'">📺 ONA MTAANI TV - JUU</button></div>
<div class="card"><input id="link" placeholder="Paste YouTube link"><input id="title" placeholder="Title (auto)"><textarea id="desc" placeholder="Description ita-scroll kwa TV"></textarea><button class="y" onclick="add()">💾 SAVE & TUMA TV</button><p id="msg" style="color:#0f0;font-size:11px"></p></div>
<div class="card"><input id="tickIn" placeholder="Ticker ya chini"><button class="g" onclick="saveT()">UPDATE TICKER</button><p style="font-size:11px;color:#888">Sasa: <span id="cur" style="color:#ffcc00">-</span></p></div>
<div class="card"><h3>Videos (<span id="cnt">0</span>)</h3><div id="list"></div></div>
<div class="card" style="border:2px solid #00ff88"><button style="background:#00ff88;color:#000;padding:20px;font-size:20px" onclick="location.href='index.html'">📺 ONA MTAANI TV - CHINI</button></div>
<script>
const get=()=>JSON.parse(localStorage.getItem('mtaani_videos_2026')||'[]');
const save=v=>{localStorage.setItem('mtaani_videos_2026',JSON.stringify(v));if(v.length){let l=v[v.length-1];localStorage.setItem('mtaani_live_id',l.id);localStorage.setItem('mtaani_ticker',l.desc)}};
const gid=u=>{if(!u) return '';if(u.length==11) return u;let m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);return m?m[1]:''};
async function add(){let id=gid(document.getElementById('link').value.trim());if(id.length!=11){alert('Link mbaya');return}let t=document.getElementById('title').value||'MTAANI TV LIVE';let d=document.getElementById('desc').value||'MTAANI TV LIVE';if(!document.getElementById('title').value){try{let r=await fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v='+id+'&format=json');let j=await r.json();t=j.title;d=j.title+' | MTAANI TV'}catch(e){}}let v=get();v.push({id:id,title:t,desc:d});save(v);document.getElementById('msg').innerText='✅ '+t;render();document.getElementById('link').value='';}
function saveT(){let t=document.getElementById('tickIn').value;localStorage.setItem('mtaani_ticker',t);document.getElementById('cur').innerText=t;alert('Updated')}
function render(){let v=get();document.getElementById('cnt').innerText=v.length;document.getElementById('cur').innerText=localStorage.getItem('mtaani_ticker')||'-';let h='';v.slice().reverse().forEach((x,i)=>{let ri=v.length-1-i;h+=`<div class="item"><div><b>${x.title}</b><br><small>${x.id}</small></div><button onclick="del(${ri})" style="width:auto;background:red;color:#fff;padding:6px 10px;border-radius:6px">X</button></div>`});document.getElementById('list').innerHTML=h||'Hakuna'}
function del(i){let v=get();v.splice(i,1);localStorage.setItem('mtaani_videos_2026',JSON.stringify(v));if(v.length) save(v);render()}
render();
</script></body></html>
