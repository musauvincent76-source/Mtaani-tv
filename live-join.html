<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTAANI TV LIVE</title>
<script src="https://meet.jit.si/external_api.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{margin:0;background:#000;height:100vh;overflow:hidden;font-family:sans-serif}
#wrap{position:relative;width:100vw;height:100vh}
#bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;background-size:cover;background-position:center;filter:brightness(1.35) contrast(1.2) saturate(1.5)}
#jitsi{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;filter:brightness(1.28) contrast(1.18) saturate(1.35)}
#bar{position:fixed;top:0;left:0;width:100%;background:rgba(0,0,0,0.7);color:#ffcc00;padding:5px;text-align:center;z-index:9999;font-weight:900;font-size:12px}
#ctrl{position:fixed;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.85);padding:8px;display:flex;gap:5px;z-index:9999}
#ctrl button{flex:1;padding:8px;border:none;border-radius:20px;font-weight:900;font-size:11px;color:#fff}
</style>
</head>
<body>
<div id="bar">📺 MTAANI TV LIVE - SCREEN 1 - WOTE PAMOJA 🔴</div>
<div id="wrap"><div id="bg"></div><div id="jitsi"></div></div>
<div id="ctrl">
<button onclick="setF('pic')" style="background:#00b300">✨ PICHA FILTER</button>
<button onclick="setF('normal')" style="background:#333">NORMAL</button>
<button onclick="swCam()" style="background:#ff6600">📷 FRONT/BACK</button>
<button onclick="toggleF()" style="background:#0066ff">🔳 FULL</button>
</div>
<script>
let p=new URLSearchParams(location.search);
let room=p.get('room')||localStorage.getItem('live_room')||'MtaaniTV-Live-Show';
let bg=p.get('bg')||'';
if(bg) document.getElementById('bg').style.backgroundImage='url('+decodeURIComponent(bg)+')';
let api=new JitsiMeetExternalAPI("meet.jit.si",{roomName:room,parentNode:document.getElementById('jitsi'),width:"100%",height:"100%",configOverwrite:{prejoinPageEnabled:false},userInfo:{displayName:"MGENI MTAANI"}});
function setF(t){
 let b=document.getElementById('bg'), j=document.getElementById('jitsi');
 if(t==='pic'){ b.style.filter='brightness(1.35) contrast(1.2) saturate(1.5)'; j.style.filter='brightness(1.28) contrast(1.18) saturate(1.35)'; }
 else { b.style.filter='none'; j.style.filter='none'; }
}
function swCam(){ alert('Badilisha camera: Jitsi ⋮ > Settings > Camera'); }
function toggleF(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
setF('pic');
</script>
</body>
