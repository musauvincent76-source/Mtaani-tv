<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTAANI TV LIVE - GUEST</title>
<script src="https://meet.jit.si/external_api.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
#jitsiWrap{position:relative;width:100vw;height:100vh;background:#000}
#jitsi{width:100%;height:100vh;position:absolute;top:0;left:0;z-index:2}
#bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;background-size:cover;background-position:center;filter:brightness(1.2) contrast(1.2) saturate(1.3)}
#controls{position:fixed;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.85);padding:8px;z-index:9999;display:flex;gap:5px;flex-wrap:wrap;justify-content:center;border-top:2px solid #ffcc00}
#controls button{padding:8px 12px;border:none;border-radius:20px;font-weight:900;font-size:11px;cursor:pointer;color:#fff;flex:1;min-width:70px}
.top-bar{position:fixed;top:0;left:0;width:100%;background:rgba(0,0,0,0.8);padding:6px 10px;z-index:9999;text-align:center;font-size:12px;color:#ffcc00;font-weight:900;border-bottom:2px solid #ffcc00}
</style>
</head>
<body>

<div class="top-bar">📺 MTAANI TV LIVE - TRUE LIVE 🔴</div>

<div id="jitsiWrap">
<div id="bg"></div>
<div id="jitsi"></div>
</div>

<div id="controls">
<button onclick="setFilter('smart')" style="background:#00b300">✨ SMART</button>
<button onclick="setFilter('beauty')" style="background:#cc00cc">💄 BEAUTY</button>
<button onclick="setFilter('normal')" style="background:#333">NORMAL</button>
<button onclick="switchCam()" style="background:#ff6600">📷 FRONT/BACK</button>
<button onclick="toggleFull()" style="background:#0066ff">🔳 FULL</button>
</div>

<script>
let params = new URLSearchParams(location.search);
let room = params.get('room') || 'MtaaniTV-Live-Show';
let bgParam = params.get('bg');
let facing = "user";
let api = null;

if(bgParam){
 document.getElementById('bg').style.backgroundImage = 'url('+decodeURIComponent(bgParam)+')';
}

function initJitsi(){
 let container = document.getElementById('jitsi');
 if(api) try{api.dispose();}catch{}
 api = new JitsiMeetExternalAPI("meet.jit.si",{
  roomName: room,
  parentNode: container,
  width: "100%",
  height: "100%",
  configOverwrite: {
    prejoinPageEnabled: false,
    startWithVideoMuted: false,
    startWithAudioMuted: false
  },
  userInfo: { displayName: "MGENI - MTAANI TV" }
 });
}

function setFilter(type){
 let bg = document.getElementById('bg');
 let j = document.getElementById('jitsi');
 if(type==='smart'){ 
  bg.style.filter='brightness(1.3) contrast(1.3) saturate(1.4)'; 
  j.style.filter='brightness(1.2) contrast(1.15) saturate(1.15)'; 
 }
 else if(type==='beauty'){ 
  bg.style.filter='brightness(1.35) contrast(1.1) saturate(1.5)'; 
  j.style.filter='brightness(1.3) contrast(1.05) saturate(1.25)'; 
 }
 else { 
  bg.style.filter='brightness(1.1)'; 
  j.style.filter='none'; 
 }
}

function switchCam(){
 facing = facing==='user' ? 'environment' : 'user';
 alert('Camera: '+(facing==='user'?'FRONT 🤳':'BACK 📷')+'\nBadilisha hapa:\nJitsi ⋮ > Settings > Camera > Chagua '+facing);
}

function toggleFull(){
 if(!document.fullscreenElement){ document.documentElement.requestFullscreen(); }
 else { document.exitFullscreen(); }
}

// Auto smart filter on start
setFilter('smart');
initJitsi();
</script>

</body>
</html>
