<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSAIDIZI LIVE V3 - NO BLOCK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#050a1f;color:#fff;font-family:sans-serif;padding:10px}
.card{background:#111c44;padding:12px;border-radius:12px;margin:10px 0;border:2px solid #00e676}
.card-yellow{background:#1a1600;padding:14px;border-radius:14px;margin:12px 0;border:2px solid #ffcc00}
input{width:100%;padding:13px;border-radius:10px;border:none;margin:6px 0;font-size:15px}
button{width:100%;padding:13px;border:none;border-radius:10px;font-weight:900;margin-top:8px;cursor:pointer;font-size:14px}
#studioWrap{position:relative;width:100%;height:65vh;background:#000;border-radius:12px;overflow:hidden;border:3px solid #ffcc00;margin-top:10px;display:none}
#bgLayer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;background-size:cover;background-position:center;pointer-events:none}
#jitsiContainer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2}
.filter-box{display:flex;gap:5px;margin:8px 0;flex-wrap:wrap}.filter-box button{flex:1;font-size:11px;padding:10px;min-width:70px}
</style>
</head>
<body>
<div id="lock" style="background:#111;padding:40px;border-radius:15px;text-align:center;margin-top:50px;border:3px solid #ff4444"><h2>🔒 SUBIRI BOSS...</h2><p id="lockMsg">Inaangalia...</p></div>
<div id="panel" style="display:none">
<div style="background:linear-gradient(90deg,#ff6600,#ffcc00);color:#000;padding:12px;border-radius:10px;text-align:center;font-weight:900">✅ Access Imefunguliwa</div>

<div class="card-yellow">
<h3>📺 POST LINK KWA TV KUBWA</h3>
<input id="postLink" placeholder="Weka link..." oninput="handleLink()">
<input id="postTitleManual" placeholder="Badilisha Jina" style="display:none;margin-top:8px;background:#222;color:#fff;border:1px solid #555">
<button onclick="sendToTV()" style="background:#00e676;color:#000">🚀 SEND TO PUBLIC TV</button>
<p id="postStatus" style="font-size:11px;color:#ffcc00;margin-top:6px"></p>
</div>

<div class="card">
<h3>🔴 LIVE KWA TV KUBWA</h3>
<input id="room" value="msaidizi-live-1">
<input type="file" id="bgInput" accept="image/*" style="background:#222;color:#fff">
<button onclick="startLive()" style="background:#ff6600;color:#fff">🔴 START LIVE - DIRECT</button>
<button onclick="switchCamera()" style="background:#333;color:#fff">📷 FRONT / BACK CAMERA</button>
<div class="filter-box">
<button onclick="setFilter('pic')" style="background:#00b300;border:2px solid #ffcc00">✨ PICHA YAKO FILTER</button>
<button onclick="setFilter('smart')" style="background:#0066ff;color:#fff">SMART</button>
<button onclick="setFilter('beauty')" style="background:#cc00cc;color:#fff">💄 BEAUTY</button>
<button onclick="setFilter('normal')" style="background:#222;color:#fff">NORMAL</button>
</div>
<div id="studioWrap"><div id="bgLayer"></div><div id="jitsiContainer"></div></div>
<button onclick="stopLive()" style="background:#111;border:1px solid #ff4444;color:#ff4444;margin-top:10px">⏹️ ZIMA LIVE</button>
<button id="dlBtn" onclick="downloadLive()" style="background:#ffcc00;color:#000;display:none">⬇️ PAKUA live.json</button>
<p id="status" style="font-size:12px;color:#0f0;margin-top:8px"></p>
</div>
</div>
<script>
let liveData=null,postData={};
async function checkAccess(){let p=new URLSearchParams(location.search);let k=p.get('key')||'';if(!k){lockMsg.innerText='❌ Hakuna KEY!';return;}try{let r=await fetch('./assistant_control.json?v='+Date.now(),{cache:'no-store'});let d=await r.json();if(!d.enabled||(d.token&&d.token!==k)){lockMsg.innerHTML='❌ KEY IMEEXPIRE';return;}lock.style.display='none';panel.style.display='block';}catch(e){setTimeout(checkAccess,3000);}}checkAccess();
bgInput.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);bgLayer.style.backgroundImage='url('+u+')';});
function handleLink(){let l=postLink.value.trim();postData={link:l,title:l};postTitleManual.style.display='block';postTitleManual.value=l;postStatus.innerText='✅ Tayari';}
function sendToTV(){let t=postTitleManual.value.trim()||postData.link;let d={link:postData.link,title:t,time:Date.now()};let b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='msaidizi-post.json';a.click();}
function startLive(){
 let room=document.getElementById('room').value.trim()||'msaidizi-live-1';
 let wrap=document.getElementById('studioWrap');
 let container=document.getElementById('jitsiContainer');
 wrap.style.display='block';
 // HII NDIO FIX - DIRECT IFRAME!
 let src=`https://meet.jit.si/${encodeURIComponent(room)}#config.prejoinPageEnabled=false&config.prejoinConfig.enabled=false&config.disableDeepLinking=true&config.startWithVideoMuted=false&config.startWithAudioMuted=false&interfaceConfig.MOBILE_APP_PROMO=false&interfaceConfig.SHOW_JITSI_WATERMARK=false&userInfo.displayName="MSAIDIZI LIVE"`;
 container.innerHTML=`<iframe src="${src}" allow="camera; microphone; fullscreen; display-capture; autoplay" style="width:100%;height:100%;border:0;background:#000"></iframe>`;
 liveData={live:true,room:room,time:Date.now(),endTime:Date.now()+10800000};
 dlBtn.style.display='block';status.innerText='🔴 LIVE DIRECT - no delay!';
}
function setFilter(t){let l=bgLayer,j=jitsiContainer;if(t==='pic'){l.style.filter='brightness(1.35) contrast(1.2) saturate(1.5)';j.style.filter='brightness(1.28) contrast(1.18) saturate(1.35)';}else if(t==='smart'){j.style.filter='brightness(1.25) contrast(1.25) saturate(1.3)';}else if(t==='beauty'){j.style.filter='brightness(1.3) contrast(1.1) saturate(1.4)';}else{j.style.filter='none';l.style.filter='none';}}
function switchCamera(){alert('Gusa icon ya camera ndani ya live kubadilisha');}
function stopLive(){jitsiContainer.innerHTML='';studioWrap.style.display='none';liveData={live:false,time:Date.now()};status.innerText='⏹️ IMEZIMWA';}
function downloadLive(){let b=new Blob([JSON.stringify(liveData,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='live.json';a.click();}
</script>
</body>
</html>
