<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTAANI TV LIVE</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
#ticker{position:fixed;top:0;left:0;right:0;background:#cc0000;color:#fff;padding:8px;white-space:nowrap;overflow:hidden;z-index:10;font-weight:bold}
#ticker span{display:inline-block;animation:scroll 20s linear infinite}
@keyframes scroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
#player{margin-top:40px;width:100vw;height:calc(100vh - 40px)}
iframe{width:100%;height:100%;border:0}
#info{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.8);padding:10px;text-align:center}
</style>
</head>
<body>
<div id="ticker"><span id="tickerText">🔴 MTAANI TV LIVE | Loading...</span></div>
<div id="player"><iframe id="yt" allowfullscreen></iframe></div>
<div id="info"><span id="title">Inapakia...</span></div>
<script>
let videos=[],current=0;
async function loadTicker(){
 try{
  let r=await fetch('ticker.json?t='+Date.now());
  let j=await r.json();
  document.getElementById('tickerText').innerText=j.text;
 }catch(e){document.getElementById('tickerText').innerText='🔴 MTAANI TV LIVE | WhatsApp: 0751768763'}
}
async function loadVideos(){
 try{
  let r=await fetch('videos.json?t='+Date.now());
  videos=await r.json();
  if(!videos||videos.length==0){document.getElementById('title').innerText='BADO HAKUNA VIDEO - Ongeza kwa admin.html';return;}
  play(0);
 }catch(e){document.getElementById('title').innerText='Error kupakua videos.json - '+e;}
}
function play(i){
 current=i;
 let v=videos[i];
 document.getElementById('title').innerText=(i+1)+'/'+videos.length+' : '+(v.title||v.id);
 document.getElementById('yt').src='https://www.youtube.com/embed/'+v.id+'?autoplay=1&mute=0';
}
document.getElementById('yt').addEventListener('ended',()=>{});
setInterval(()=>{
 if(videos.length>0){
  current=(current+1)%videos.length;
  play(current);
 }
}, 300000);
loadTicker();loadVideos();
</script>
</body>
</html>
