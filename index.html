<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZAM ALE TV</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}header{background:#001a4d;padding:12px 16px;display:flex;justify-content:space-between;border-bottom:3px solid #ff6600}header b span{color:#ff6600}.live{background:red;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:900} #tv{flex:1;position:relative;background:#000}#tv #player{width:100%;height:100%;position:absolute;top:0;left:0}#tap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#ff6600;color:#fff;padding:12px 24px;border-radius:30px;border:2px solid #fff;font-weight:900;z-index:10}#info{padding:10px 16px;background:#0a1430;display:flex;justify-content:space-between;font-size:13px}#tick{height:36px;background:#0a2a8a;display:flex;align-items:center;overflow:hidden;border-top:2px solid #fff}#tick span{white-space:nowrap;animation:s 30s linear infinite;font-weight:900;padding-left:100%}@keyframes s{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}</style>
</head><body>
<header><b>AZAM <span>ALE TV</span></b><span class="live">● LIVE</span></header>
<div id="tv"><div id="player"></div><button id="tap" onclick="unmute()">🔊 WASHA SAUTI</button></div>
<div id="info"><span id="title">Inapakia 1/4...</span><span id="count">LIVE</span></div>
<div id="tick"><span>AZAM ALE TV MTAANI | TILL 3624692 | Inacheza mwanzo hadi mwisho - 1,2,3,4!</span></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player, list=[], cur=0;

async function getVideos(){
 try{
  let r=await fetch('videos.json?v='+Date.now(),{cache:'no-store'});
  let d=await r.json();
  return d.map(v=>({id:(v.id||'').trim(), title:v.title||'MTAANI TV'})).filter(v=>v.id.length>8);
 }catch{return [];}
}

function onYouTubeIframeAPIReady(){
 getVideos().then(v=>{
  list=v.length? v : [
   {id:'4EDkfksVFdE',title:'MTAANI 1'},
   {id:'kHc8ELzuIKM',title:'MTAANI 2'},
   {id:'HAQCI_JrycQ',title:'MTAANI 3'},
   {id:'QXm2HdKdZkQ',title:'MTAANI 4'}
  ];
  cur=0;
  document.getElementById('title').innerText=list[cur].title+' - 1/'+list.length;
  document.getElementById('count').innerText='1/'+list.length;

  player=new YT.Player('player',{
   videoId:list[cur].id,
   playerVars:{autoplay:1,mute:1,controls:1,rel:0,modestbranding:1,playsinline:1,start:0},
   events:{
    onReady:e=>{
     e.target.playVideo();
     // Angalia 90% ndio iruke NEXT - sio irudi katikati!
     setInterval(()=>{
      try{
       let d=player.getDuration(), t=player.getCurrentTime();
       if(d>10 && t/d >= 0.90){ playNext(); }
      }catch{}
     },2000);
    },
    onStateChange:e=>{ if(e.data===0) playNext(); }
   }
  });
 });
}

function playNext(){
 cur=(cur+1)%list.length; // HII NDIO SIRI - inaongeza 1,2,3,4 sio kurudi nyuma!
 document.getElementById('title').innerText=list[cur].title+' - '+(cur+1)+'/'+list.length;
 document.getElementById('count').innerText=(cur+1)+'/'+list.length;
 player.loadVideoById(list[cur].id);
}

function unmute(){ player.unMute(); player.setVolume(100); document.getElementById('tap').style.display='none'; }
</script>
</body></html>
