<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTAANI TV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#000;color:#fff}
.top{position:fixed;top:0;left:0;right:0;height:52px;background:#111;display:flex;justify-content:space-between;align-items:center;padding:0 14px;z-index:99;border-bottom:1px solid #222}
.top b{font-size:20px}.top b span{color:#ff0000}
.live{color:#fff;background:#ff0000;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:900;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.player{margin-top:52px;width:100%;aspect-ratio:16/9;background:#000}
.player iframe{width:100%;height:100%;border:none}
/* DESCRIPTION COLLEGE JUU */
.info{padding:14px 15px 50px 15px;background:#0f0f0f;position:relative}
.info h2{font-size:16px;font-weight:700}
.info.views{margin-top:8px;color:#666;font-size:11px}
/* SAA KWA CORNER CHINI KIDOGO */
.clockBox{position:absolute;right:12px;bottom:12px;background:#222;padding:6px 10px;border-radius:7px;font-size:11px}
/* AD IMESUKUMWA CHINI 1.5 INCH KAMA ULISEMA */
.adBox{margin-top:60px;background:#0a0a0a;min-height:120px;display:flex;align-items:center;justify-content:center;color:#333;border-top:1px solid #111;border-bottom:1px solid #111}
.ticker{position:fixed;bottom:0;left:0;right:0;height:30px;background:#ff0000;color:#fff;display:flex;align-items:center;overflow:hidden;white-space:nowrap;z-index:99}
.ticker span{padding-left:100%;animation:scroll 25s linear infinite;display:inline-block;font-size:11px}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.pad{height:32px}
</style>
</head>
<body>

<div class="top">
<b>MTAANI <span>TV</span></b>
<div class="live">🔴 LIVE</div>
</div>

<div class="player"><div id="player"></div></div>

<div class="info">
<h2 id="title">MTAANI TV</h2>
<div class="views" id="views">👁️ 1,247 watching</div>
<div class="clockBox" id="clock">--:--</div>
</div>

<!-- AD PEKE YAKE - IMESUKUMWA CHINI 1.5 INCH - HAKUNA MANENO MINGI -->
<div class="adBox" id="ad">
<!-- WEKA CODE YAKO YA ADSENSE HAPA TU -->
</div>

<div class="ticker"><span id="tick">🔴 MTAANI TV LIVE 24/7 | 👁️ <b id="tc">1,247</b> watching | </span></div>
<div class="pad"></div>

<script>
let videos=[],ci=0,coff=0,player;
function clk(){ document.getElementById('clock').innerText=new Date().toLocaleTimeString(); }
setInterval(clk,1000); clk();

async function load(){
 try{
  let r=await fetch('videos.json?v='+Date.now());
  videos=await r.json();
  if(!videos.length) throw 0;
  let total=videos.reduce((a,b)=>a+(b.duration||300),0);
  let now=Math.floor(Date.now()/1000)%total, acc=0;
  for(let i=0;i<videos.length;i++){ let d=videos[i].duration||300; if(now<acc+d){ci=i;coff=now-acc;break;} acc+=d; }
  go();
 }catch(e){ document.getElementById('title').innerText='MTAANI TV - Hakuna video'; }
}
function go(){
 if(!window.YT){ let s=document.createElement('script'); s.src="https://www.youtube.com/iframe_api"; document.body.appendChild(s); window.onYouTubeIframeAPIReady=mk; } else mk();
}
function mk(){
 let v=videos[ci];
 document.getElementById('title').innerText=v.title;
 player=new YT.Player('player',{videoId:v.id,playerVars:{autoplay:1,controls:0,modestbranding:1,rel:0},events:{onReady:e=>{e.target.mute(); if(coff>5) e.target.seekTo(coff,true); e.target.playVideo();},onStateChange:e=>{if(e.data==0){ci=(ci+1)%videos.length;coff=0; player.loadVideoById(videos[ci].id); document.getElementById('title').innerText=videos[ci].title;}}}});
}
load();
let c=1247; setInterval(()=>{c++; document.getElementById('views').innerText='👁️ '+c+' watching'; document.getElementById('tc').innerText=c;},3500);
</script>
</body>
</html>
