<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MTAANI TV LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-family:Arial Black,Arial}
#topBar{height:48px;background:#000;display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-bottom:2px solid #ffcc00;flex-shrink:0}
#logo{color:#ffcc00;font-size:20px}#clock{color:#fff;font-size:16px}
#player{flex:1;background:#000;position:relative;overflow:hidden}
#player iframe{width:100%;height:100%;border:0}
#unmute{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#ffcc00;color:#000;padding:14px 22px;border-radius:30px;font-weight:900;border:none;z-index:10;cursor:pointer}
#bottomTicker{height:42px;background:#0a2a8a;display:flex;align-items:center;overflow:hidden;border-top:2px solid #fff;flex-shrink:0}
#bottomTicker span{white-space:nowrap;padding-left:100%;animation:scroll 40s linear infinite;color:#fff;font-weight:900;display:inline-block}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ffcc00;text-align:center;z-index:5}
</style></head>
<body>
<div id="topBar"><span id="logo">MTAANI TV</span><span id="clock">--:--:--</span></div>
<div id="player">
  <iframe id="yt" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  <button id="unmute">🔊 WASHA SAUTI</button>
  <div id="msg" style="display:none">Nenda ADMIN<br><br><a href="admin.html" style="background:#ffcc00;color:#000;padding:10px 15px;border-radius:20px;text-decoration:none;font-weight:900">FUNGUA ADMIN</a></div>
</div>
<div id="bottomTicker"><span id="tickerText">MTAANI TV LIVE | TILL 3624692 | Karibu Mtaani!</span></div>
<script>
const KEY='azamtv_ale_final_2026';
let yt=document.getElementById('yt'), btn=document.getElementById('unmute'), msg=document.getElementById('msg');
let list=[];

async function load(){
  // 1. Jaribu localStorage (Azam admin yako)
  try{
    let s=localStorage.getItem(KEY);
    if(s){let o=JSON.parse(s); if(o.playlist && o.playlist.length) list=o.playlist;}
  }catch(e){}
  // 2. Kama bado tupu, jaribu videos.json kutoka GitHub (kwa watu wengine)
  if(!list.length){
    try{
      let r=await fetch('videos.json?v='+Date.now());
      let j=await r.json();
      list=j.map(v=> typeof v==='string'? {ytid:v, id:v} : {ytid:v.id||v.ytid, id:v.id||v.ytid, title:v.title||v.ytid}).filter(v=>v.ytid && v.ytid!=='jNQXAC9IVRw');
    }catch(e){}
  }
  // 3. Kama bado tupu - cheza video ya default ya Mtaani ili isiwe black
  if(!list.length){
    list=[{ytid:'ScMzIvxBSi4', title:'Mtaani Default'}]; // video ya sample - itaonekana
    msg.style.display='block';
  } else {
    msg.style.display='none';
  }

  // TRUE LIVE
  let total=list.length*300;
  let elapsed=Math.floor(Date.now()/1000)%total;
  let idx=Math.floor(elapsed/300)%list.length;
  let offset=elapsed%300;
  let ytid=list[idx].ytid;

  yt.src=`https://www.youtube.com/embed/${ytid}?autoplay=1&mute=1&controls=0&rel=0&modestbranding=1&playsinline=1&start=${offset}`;
  btn.style.display='block';
  let left=300-offset;
  setTimeout(load, (left+2)*1000);
}
btn.onclick=()=>{ yt.src=yt.src.replace('mute=1','mute=0'); btn.style.display='none'; };
setInterval(()=>{document.getElementById('clock').innerText=new Date().toLocaleTimeString('en-KE',{hour12:false});},1000);
load();
</script>
</body></html>
