<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{background:#001a4d;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #ff6600}header b{font-size:26px;letter-spacing:2px;font-weight:900}header b span{color:#ff6600}.badge{background:red;padding:6px 12px;border-radius:15px;font-size:11px;font-weight:900;animation:blink 1s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
#wrap{flex:1;position:relative;background:#000;min-height:60vh}

#liveWrap{width:100%;height:100%;position:absolute;top:0;left:0;display:none;z-index:5}
#liveBg{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;filter:brightness(1.35) contrast(1.2) saturate(1.5);z-index:1}
#liveJitsi{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;filter:brightness(1.28) contrast(1.18) saturate(1.35)}
#clock{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,0.75);padding:6px 12px;border-radius:6px;font-weight:900;font-size:14px;z-index:10;border:1px solid #ff6600;color:#ffcc00;letter-spacing:1px}
.bar{padding:12px 16px;background:#0a1430;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ff6600}#title{font-weight:900;font-size:15px;color:#ffcc00;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
#tick{height:36px;background:#0a2a8a;display:flex;align-items:center;overflow:hidden;border-top:2px solid #fff;border-bottom:2px solid #ff6600}#tick span{white-space:nowrap;padding-left:100%;animation:s 35s linear infinite;font-weight:900}@keyframes s{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#ad-box{padding:18px;text-align:center;font-weight:900;min-height:130px;display:flex;flex-direction:column;justify-content:center;align-items:center;border:3px solid #000;background:#ffcc00;color:#000}
#progress{height:8px;background:#222;position:relative}#progress div{height:100%;background:linear-gradient(90deg,#ff6600,#ffcc00);width:0%;transition:width 0.5s linear}
#progress b{position:absolute;right:6px;top:-18px;font-size:10px;color:#ffcc00}
#liveBadge{position:absolute;top:12px;left:12px;background:red;color:#fff;padding:5px 14px;border-radius:20px;font-weight:900;font-size:13px;z-index:20;display:none;animation:blink 1s infinite}
#playNowBadge{position:absolute;top:12px;right:12px;background:#00ff00;color:#000;padding:6px 14px;border-radius:20px;font-weight:900;font-size:12px;z-index:30;display:none;animation:blink 1s infinite}
#fullBadge{position:absolute;top:50px;left:12px;background:#ffcc00;color:#000;padding:5px 14px;border-radius:20px;font-weight:900;font-size:11px;z-index:20;display:none}
</style></head><body>
<header><b>MTAANI <span>TV</span></b><span class="badge" id="badge">● LIVE</span></header>
<div id="wrap">
<div id="player"></div>
<div id="liveWrap"><div id="liveBg"></div><div id="liveJitsi"></div></div>

</div>

<div class="bar"><span id="title">MTAANI TV LIVE...</span><span id="count">LIVE</span></div>
<div id="tick"><span id="ticker">MTAANI TV TRUE LIVE 24/7 | PHONE NUMBER  0751 768763 TILL 3624692</span></div>
<div id="ad-box"><h2 id="adT">📢 TANGAZA HAPA!</h2><p id="adM">Watu 1000+ LIVE</p><span id="adC" style="background:#000;color:#ffcc00;padding:5px 12px;border-radius:20px;margin-top:8px;display:inline-block">💰 TILL: 3624692</span></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
function isChannelLink(t){ if(!t) return false; t=t.toLowerCase(); return t.includes('@') || t.includes('/channel/') || t.includes('/c/') || t.includes('youtube.com/@'); }
function cleanHandle(t){ if(!t) return t; t=t.trim(); let m=t.match(/@([a-zA-Z0-9_.-]+)/); if(m) return '@'+m[1]; return t; }
function extractID(t){if(!t)return null;t=t.trim();if(isChannelLink(t)) return t; if(/^[a-zA-Z0-9_-]{11}$/.test(t))return t;let m=t.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/live\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);if(m)return m[1];try{let u=new URL(t);let v=u.searchParams.get('v');if(v&&v.length===11)return v;}catch{}let m2=t.match(/[a-zA-Z0-9_-]{11}/);return m2?m2[0]:null;}
let player,list=[],jitsiApi=null,isLiveMode=false,isPlayNowMode=false,lastVideoId="",_lastIdx=-1,playNowVideo=null;const LOOP_START=new Date('2025-01-01T00:00:00Z').getTime();
async function getVideos(){try{let r=await fetch('videos.json?v='+Date.now(),{cache:'no-store'});let d=await r.json();
let f=d.map(v=>{
  let raw=v.id||v.url||'';
  let isFull = v.isFullChannel||v.full||isChannelLink(raw);
  if(isFull){
    return {id:raw, raw:raw, handle:cleanHandle(raw), dur:parseInt(v.duration)||1800, title:v.title||('FULL CHANNEL: '+cleanHandle(raw)), isFullChannel:true};
  }
  let vid=extractID(raw);
  if(!vid||vid.length!==11) return null;
  return {id:vid, raw:raw, dur:parseInt(v.duration)||300, title:v.title||'MTAANI TV', isFullChannel:false};
}).filter(v=>v!==null);
if(f.length>0)return f;}catch(e){console.log(e)}return [{id:'4EDkfksVFdE',dur:300,title:'MTAANI TV',isFullChannel:false}];}
function getLivePos(total){return Math.floor((Date.now()-LOOP_START)/1000)%total}
function findV(pos){let a=0;for(let i=0;i<list.length;i++){if(pos<a+list[i].dur)return{index:i,seek:pos-a,start:a};a+=list[i].dur}return{index:0,seek:0,start:0}}

// --- FIX 1: FULL CHANNEL SASA HAITUMII SEARCH ILIYOBLOCKIWA ---
function playEntry(idx, seek){
  if(!list[idx]) return;
  let v=list[idx];
  if(v.isFullChannel){
    document.getElementById('fullBadge').style.display='block';
    document.getElementById('fullBadge').innerText='📺 FULL: '+v.handle;
    try{
      let h = v.handle.replace('@','').trim();
      // Jaribu user playlist kwanza - search imeblockiwa na YouTube
      player.loadPlaylist({list:h, listType:'user'});
      setTimeout(()=>{try{player.unMute();player.setVolume(100);player.playVideo();}catch{}},1500);
    }catch(e){
      try{ player.loadPlaylist({list:v.handle.replace('@','').trim(), listType:'search'}); }catch{}
    }
  } else {
    document.getElementById('fullBadge').style.display='none';
    try{ player.loadVideoById({videoId:v.id,startSeconds:seek||0}); }catch{}
  }
}
function playPlayNow(v){
  try{
    if(v.isFullChannel){
      document.getElementById('fullBadge').style.display='block';
      document.getElementById('fullBadge').innerText='📺 FULL: '+v.handle;
      let h = v.handle.replace('@','').trim();
      player.loadPlaylist({list:h, listType:'user'});
    } else {
      document.getElementById('fullBadge').style.display='none';
      player.loadVideoById({videoId:v.id,startSeconds:0});
    }
    setTimeout(()=>{try{player.unMute();player.setVolume(100);player.playVideo();}catch{}},1000);
  }catch{}
}
function updateUI(idx){if(!list[idx]||isLiveMode)return;document.getElementById('title').innerText=list[idx].title;document.getElementById('ticker').innerText=list[idx].title.toUpperCase()+" | MTAANI TV TRUE LIVE 24/7 | TILL 3624692"; if(list[idx].isFullChannel){document.getElementById('fullBadge').style.display='block';} else {document.getElementById('fullBadge').style.display='none';}}
function updateUIFromVideo(v){document.getElementById('title').innerText=v.title;document.getElementById('ticker').innerText=v.title.toUpperCase()+" | MTAANI TV TRUE LIVE 24/7 | TILL 3624692";}
async function checkLive(){try{let r=await fetch('live.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 'no live';let d=await r.json();if(d.live&&d.room){if(!isLiveMode||window._currentLiveRoom!==d.room)startPublicLive(d.room,d.bg);}else{if(isLiveMode)stopPublicLive();}}catch{if(isLiveMode)stopPublicLive();}}
function startPublicLive(room,bg){isLiveMode=true;window._currentLiveRoom=room;document.getElementById('player').style.display='none';document.getElementById('liveWrap').style.display='block';document.getElementById('liveBadge').style.display='block';document.getElementById('badge').innerText='● TRUE LIVE 3HRS';document.getElementById('badge').style.background='#00b300';document.getElementById('title').innerText='🔴 TRUE LIVE - SCREEN 1 - WOTE PAMOJA';document.getElementById('ticker').innerText='🔴 TRUE LIVE - WOTE PAMOJA - HAIISHI MPAKA 3HRS | TILL 3624692';document.getElementById('count').innerText='LIVE 3HRS';document.getElementById('pbar').style.width='100%';document.getElementById('ptext').innerText='LIVE';if(bg)document.getElementById('liveBg').style.backgroundImage='url('+bg+')';let container=document.getElementById('liveJitsi');if(jitsiApi)try{jitsiApi.dispose();}catch{}jitsiApi=new JitsiMeetExternalAPI("meet.jit.si",{roomName:room,parentNode:container,width:"100%",height:"100%",configOverwrite:{prejoinPageEnabled:false,startWithVideoMuted:false,startWithAudioMuted:true},userInfo:{displayName:"MTAZAMAJI TV"}});}
function stopPublicLive(){isLiveMode=false;document.getElementById('player').style.display='block';document.getElementById('liveWrap').style.display='none';document.getElementById('liveBadge').style.display='none';document.getElementById('badge').innerText='● LIVE';document.getElementById('badge').style.background='red';if(jitsiApi)try{jitsiApi.dispose();jitsiApi=null;}catch{}if(player&&list.length>0){let total=list.reduce((s,x)=>s+x.dur,0);let live=findV(getLivePos(total));try{ playEntry(live.index, live.seek); }catch{}}}

// --- FIX 2: PLAY NOW IME-LOCK ---
async function checkNewVideos(){if(isLiveMode)return;try{let newList=await getVideos();if(newList.length===0)return;if(!lastVideoId){lastVideoId=newList[0].raw||newList[0].id;list=newList;return;}let newFirst=(newList[0].raw||newList[0].id);if(newFirst!==lastVideoId){console.log("PLAY NOW MPYA");list=newList;lastVideoId=newFirst;playNowVideo=newList[0];isPlayNowMode=true;document.getElementById('playNowBadge').style.display='block';document.getElementById('playNowBadge').innerText='▶️ PLAY NOW: '+playNowVideo.title.substring(0,25);document.getElementById('count').innerText='PLAY NOW';updateUIFromVideo(playNowVideo);if(player) playPlayNow(playNowVideo);}else{if(isPlayNowMode) return; list=newList;}}catch(e){}}

function onYouTubeIframeAPIReady(){getVideos().then(v=>{list=v;if(list.length>0)lastVideoId=list[0].raw||list[0].id;let total=list.reduce((s,x)=>s+x.dur,0);let live=findV(getLivePos(total));updateUI(live.index);document.getElementById('count').innerText=(live.index+1)+"/"+list.length;player=new YT.Player('player',{playerVars:{autoplay:1,mute:0,controls:0,rel:0,modestbranding:1,playsinline:1,fs:0,disablekb:1,vq:'small'},events:{onReady:e=>{
  playEntry(live.index, live.seek);
  e.target.setVolume(100);e.target.unMute();e.target.playVideo();
  setTimeout(()=>{try{e.target.unMute();e.target.setVolume(100);let realDur=e.target.getDuration();if(realDur>0&&!list[live.index].isFullChannel){list[live.index].dur=Math.floor(realDur);}}catch{}},1500);
},onError:e=>{
  console.log("YT ERROR",e.data);
  if(isPlayNowMode){
    document.getElementById('ptext').innerText='RETRY PLAY NOW...';
    setTimeout(()=>{ if(playNowVideo) playPlayNow(playNowVideo); },2000);
  } else if(list[_lastIdx] && list[_lastIdx].isFullChannel){
    // FULL CHANNEL ikikataa - ruka kwenda next badala ya kukwama na error screen
    document.getElementById('ptext').innerText='FULL ERROR - NEXT';
    setTimeout(()=>{ goNext(); },2000);
  }
},onStateChange:e=>{
  if(e.data===0){
    if(isPlayNowMode){
      isPlayNowMode=false;
      playNowVideo=null;
      document.getElementById('playNowBadge').style.display='none';
      let total=list.reduce((s,x)=>s+x.dur,0);
      let live=findV(getLivePos(total));
      _lastIdx=live.index;
      updateUI(live.index);
      document.getElementById('count').innerText=(live.index+1)+"/"+list.length;
      playEntry(live.index, live.seek);
      return;
    }
    if(!isLiveMode) goNext();
  }
}}});setInterval(()=>{if(isLiveMode){document.getElementById('pbar').style.width='100%';document.getElementById('ptext').innerText='LIVE';return;}if(isPlayNowMode){try{let curT=player.getCurrentTime();let durT=player.getDuration();if(durT>0){let pct=Math.floor((curT/durT)*100);document.getElementById('pbar').style.width=pct+'%';document.getElementById('ptext').innerText='PLAY NOW '+pct+'%';}}catch{}return;}try{let curT=player.getCurrentTime();let durT=player.getDuration();if(durT>0&&!list[_lastIdx]?.isFullChannel){let idx=_lastIdx>=0?_lastIdx:0;if(list[idx])list[idx].dur=Math.floor(durT);let pct=Math.floor((curT/durT)*100);if(pct>=0&&pct<=100){document.getElementById('pbar').style.width=pct+'%';document.getElementById('ptext').innerText=pct+'%';}} }catch{}let total=list.reduce((s,x)=>s+x.dur,0);let pos=getLivePos(total);let cur=findV(pos);if(cur.index!==_lastIdx){try{let curT=player.getCurrentTime();let durT=player.getDuration();if(durT>0 && curT < durT-10 &&!list[_lastIdx]?.isFullChannel){return;}}catch{}_lastIdx=cur.index;updateUI(cur.index);document.getElementById('count').innerText=(cur.index+1)+"/"+list.length;if(player) playEntry(cur.index, cur.seek);}},1000);setInterval(checkLive,5000);setInterval(checkNewVideos,3000);checkLive();});}
function goNext(){if(isLiveMode||isPlayNowMode)return;let total=list.reduce((s,x)=>s+x.dur,0);let live=findV(getLivePos(total));if(player) playEntry(live.index, live.seek);updateUI(live.index);}
function updateClock(){let now=new Date();document.getElementById('clock').innerText=String(now.getHours()).padStart(2,'0')+":"+String(now.getMinutes()).padStart(2,'0')+":"+String(now.getSeconds()).padStart(2,'0');}setInterval(updateClock,1000);updateClock();
document.addEventListener('click',()=>{try{if(!isLiveMode){player.unMute();player.setVolume(100);player.playVideo();}}catch{}});
async function loadAds(){let ads=[];try{let r=await fetch('ads.json?v='+Date.now(),{cache:'no-store'});let d=await r.json();if(Array.isArray(d)&&d.length>0)ads=d;}catch{}if(!ads.length)ads=[{title:'📢 TANGAZA HAPA!',msg:'Watu 1000+ LIVE',contact:'💰 TILL: 3624692'}];let i=0;function show(){let a=ads[i%ads.length];document.getElementById('adT').innerText=a.title;document.getElementById('adM').innerText=a.msg;document.getElementById('adC').innerText=a.contact;i++;}show();setInterval(show,5000);}loadAds();
</script></body></html>
