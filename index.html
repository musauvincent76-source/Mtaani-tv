<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ALE TV KE LIVE - Azam Style</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050a14;color:#fff;font-family:'Segoe UI',sans-serif}
header{background:linear-gradient(90deg,#001a4d,#002a7a);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #ff6600;position:sticky;top:0;z-index:99}
header b{letter-spacing:1px} header b span{color:#ff6600}
.badge{background:#ff0033;color:#fff;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:900;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
#playerWrap{width:100%;aspect-ratio:16/9;background:#000;position:relative;overflow:hidden}
#playerWrap iframe{width:100%;height:100%;border:0;position:absolute;top:0;left:0}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#888;width:80%}
.info{padding:16px;background:linear-gradient(180deg,#0a1430,#050a14)}
.title{font-size:18px;font-weight:900}
.meta{font-size:11px;opacity:.6;margin-top:4px}
.btn-join{background:linear-gradient(90deg,#ff6600,#ff8800);color:#fff;border:0;padding:14px;width:100%;border-radius:30px;font-weight:900;margin-top:14px;cursor:pointer}
#unmute{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#ff6600;color:#fff;padding:12px 20px;border-radius:30px;font-weight:900;border:none;z-index:20;cursor:pointer;display:none}
</style></head><body>
<header><b>AZAM <span>ALE TV</span></b><span class="badge">● LIVE</span></header>
<div id="playerWrap">
  <div id="msg">📺 Inapakia...<br><span style="font-size:11px">Tafadhali subiri</span></div>
  <div id="player"></div>
  <button id="unmute">🔊 WASHA SAUTI</button>
</div>
<div class="info"><div class="title" id="vTitle">Karibu ALE TV KE LIVE</div><div class="meta" id="vMeta">Azam TV Experience</div><button class="btn-join" onclick="location.reload()">🔄 Refresh</button></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const KEY='azamtv_ale_final_2026';
let ytPlayer, currentList=[], currentIdx=0;

function getPlaylist(){
  try{
    let s=localStorage.getItem(KEY);
    if(s){let o=JSON.parse(s); if(o.playlist && o.playlist.length) return o.playlist;}
    let s2=localStorage.getItem('aletv_state_v2');
    if(s2){let o=JSON.parse(s2); if(o.playlist && o.playlist.length) return o.playlist;}
  }catch(e){}
  return [];
}

async function getFinalList(){
  let list=getPlaylist();
  if(!list.length){
    try{
      let r=await fetch('videos.json?v='+Date.now());
      let j=await r.json();
      list=j.map(v=>({ytid:v.id||v.ytid, title:v.title||v.ytid, cat:v.cat||'Live'})).filter(v=>v.ytid && v.ytid!=='jNQXAC9IVRw');
    }catch(e){}
  }
  if(!list.length) list=[{ytid:'ScMzIvxBSi4', title:'MTAANI TV - Karibu'}];
  return list;
}

function onYouTubeIframeAPIReady(){
  getFinalList().then(list=>{
    currentList=list;
    document.getElementById('msg').style.display='none';
    let first=list[0];
    document.getElementById('vTitle').innerText=first.title;
    document.getElementById('vMeta').innerText='● LIVE: '+first.title;
    ytPlayer=new YT.Player('player',{
      width:'100%', height:'100%',
      videoId:first.ytid,
      playerVars:{autoplay:1, mute:1, controls:0, rel:0, modestbranding:1, playsinline:1, iv_load_policy:3, vq:'tiny'},
      events:{'onReady':e=>{e.target.playVideo(); document.getElementById('unmute').style.display='block';}, 'onStateChange':onState}
    });
  });
}

function onState(e){
  if(e.data===0){ // video imeisha - enda ya pili, hakuna kurudi nyuma ya 3 sec
    currentIdx=(currentIdx+1)%currentList.length;
    let next=currentList[currentIdx];
    document.getElementById('vTitle').innerText=next.title;
    document.getElementById('vMeta').innerText='● LIVE: '+next.title;
    ytPlayer.loadVideoById({videoId:next.ytid});
  }
}

document.getElementById('unmute').onclick=function(){
  ytPlayer.unMute(); ytPlayer.setVolume(100); this.style.display='none';
};
</script></body></html>
