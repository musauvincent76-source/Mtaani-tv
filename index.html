<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZAM ALE TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:#001a4d;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #ff6600}
header b{font-size:18px}header b span{color:#ff6600}
.live{background:red;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:900;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
#tv{flex:1;background:#000;position:relative;display:flex;align-items:center;justify-content:center}
#tv iframe{width:100%;height:100%;border:0;position:absolute;top:0;left:0}
#bigBtn{position:absolute;z-index:20;background:#ff6600;color:#fff;padding:18px 32px;border-radius:50px;border:3px solid #fff;font-weight:900;font-size:18px;box-shadow:0 0 20px #ff6600}
#bigBtn:active{transform:scale(.95)}
.info{padding:12px 16px;background:#0a1430;display:flex;justify-content:space-between;font-size:13px;font-weight:700}
#ticker{height:38px;background:#0a2a8a;display:flex;align-items:center;overflow:hidden;border-top:2px solid #fff}
#ticker span{white-space:nowrap;padding-left:100%;animation:scroll 30s linear infinite;font-weight:900;font-size:14px}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
</style>
</head><body>
<header><b>AZAM <span>ALE TV</span></b><span class="live">● LIVE TV</span></header>

<div id="tv">
 <iframe id="player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
 <button id="bigBtn" onclick="startTV()">📺 WASHA TV - BONGOZA HAPA</button>
</div>

<div class="info"><span id="title">MTAANI TV - Inapakia...</span><span id="count">--/--</span></div>
<div id="ticker"><span>AZAM ALE TV MTAANI | TILL 3624692 | TAZAMA LIVE 24/7 | Hii ni TV yako - Haina Glitch Tena!</span></div>

<script>
let videos=[], cur=0, timer=null;

async function loadVideos(){
 try{
  let r=await fetch('videos.json?v='+Date.now(),{cache:'no-store'});
  let data=await r.json();
  videos=data.map(v=>({id:(v.id||v.ytid||'').trim(), title:v.title||'MTAANI TV', dur:300})).filter(v=>v.id.length>=10);
  if(videos.length===0) throw 'empty';
  document.getElementById('title').innerText=videos[0].title;
  document.getElementById('count').innerText='1/'+videos.length;
 }catch(e){
  videos=[{id:'4EDkfksVFdE',title:'MTAANI TV 1'},{id:'kHc8ELzuIKM',title:'MTAANI TV 2'},{id:'HAQCI_JrycQ',title:'MTAANI TV 3'},{id:'QXm2HdKdZkQ',title:'MTAANI TV 4'}];
 }
}

function playCur(){
 let v=videos[cur];
 document.getElementById('title').innerText=v.title;
 document.getElementById('count').innerText=(cur+1)+'/'+videos.length;
 document.getElementById('player').src='https://www.youtube.com/embed/'+v.id+'?autoplay=1&mute=0&controls=1&rel=0&modestbranding=1&playsinline=1';
 // Ruka baada ya 90% = 4.5 min (270 sec) - badala ya kusubiri video iishe
 clearInterval(timer);
 timer=setInterval(()=>{ nextVideo(); }, 270000); // 4 min 30 sec = 90% ya 5min
}

function nextVideo(){
 cur=(cur+1)%videos.length;
 playCur();
}

function startTV(){
 document.getElementById('bigBtn').style.display='none';
 playCur();
}

loadVideos();
</script>
</body></html>
