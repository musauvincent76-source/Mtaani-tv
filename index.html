<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZAM ALE TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{background:#001a4d;padding:12px 16px;display:flex;justify-content:space-between;border-bottom:3px solid #ff6600}header b span{color:#ff6600}.badge{background:red;padding:5px 10px;border-radius:15px;font-size:10px;font-weight:900;animation:b 1s infinite}@keyframes b{50%{opacity:.5}}
#wrap{flex:1;position:relative;background:#000;min-height:55vh;overflow:hidden}
#player{width:100%;height:100%;position:absolute;top:0;left:0}
#playBox{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;display:flex;flex-direction:column;align-items:center;cursor:pointer}
#playBtn{background:#ff6600;color:#fff;width:90px;height:90px;border-radius:50%;border:4px solid #fff;display:flex;justify-content:center;align-items:center;font-size:42px;box-shadow:0 0 25px #ff6600;animation:pulse 1s infinite}
#playText{margin-top:12px;background:rgba(0,0,0,0.8);color:#ffcc00;padding:8px 16px;border-radius:20px;font-weight:900;font-size:14px;text-align:center;border:1px solid #ff6600}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.bar{padding:10px 16px;background:#0a1430;display:flex;justify-content:space-between;font-size:13px}
#tick{height:36px;background:#0a2a8a;display:flex;align-items:center;overflow:hidden;border-top:2px solid #fff;border-bottom:2px solid #ff6600}#tick span{white-space:nowrap;padding-left:100%;animation:s 35s linear infinite;font-weight:900}@keyframes s{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#ad-box{padding:18px;text-align:center;font-weight:900;min-height:130px;display:flex;flex-direction:column;justify-content:center;align-items:center;border:3px solid #fff;animation:c 4s infinite}@keyframes c{0%{background:linear-gradient(135deg,#ff0000,#ff6600)}25%{background:linear-gradient(135deg,#0066ff,#00ccff)}50%{background:linear-gradient(135deg,#ffcc00,#ffff00);color:#000}75%{background:linear-gradient(135deg,#ff00aa,#ff6600)}100%{background:linear-gradient(135deg,#ff0000,#ff6600)}}
</style></head><body>

<div id="wrap">
<div id="player"></div>
<div id="playBox" onclick="playTV()">
<div id="playBtn">▶</div>
<div id="playText">👆 GUSA HAPA USIKIE SAUTI 🔊</div>
</div>
</div>

<div class="bar"><span id="title">TRUE LIVE...</span><span id="count">LIVE</span></div>
<div id="tick"><span>MTAANI TV TRUE LIVE 24/7 | TILL 3624692 | TANGAZA BIASHARA YAKO HAPA!</span></div>
<div id="ad-box"><h2 id="adT">📢 TANGAZA HAPA!</h2><p id="adM">Watu 1000+ LIVE</p><span id="adC" style="background:#000;color:#ffcc00;padding:5px 12px;border-radius:20px;margin-top:8px;display:inline-block">💰 TILL: 3624692</span></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
function extractID(t){if(!t)return null;t=t.trim();if(/^[a-zA-Z0-9_-]{11}$/.test(t))return t;let m=t.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/live\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);if(m)return m[1];try{let u=new URL(t);let v=u.searchParams.get('v');if(v&&v.length===11)return v;}catch{}let m2=t.match(/[a-zA-Z0-9_-]{11}/);return m2?m2[0]:null;}
let player,list=[];const LOOP_START=new Date('2025-01-01T00:00:00Z').getTime();
async function getVideos(){try{let r=await fetch('videos.json?v='+Date.now(),{cache:'no-store'});let d=await r.json();let f=d.map(v=>({id:extractID(v.id||v.url||''),dur:parseInt(v.duration)||300,title:v.title||'MTAANI TV'})).filter(v=>v.id&&v.id.length===11);if(f.length>0)return f;}catch{}return [{id:'4EDkfksVFdE',dur:300,title:'MTAANI TV'}];}
function getLivePos(total){return Math.floor((Date.now()-LOOP_START)/1000)%total}function findV(p){let a=0;for(let i=0;i<list.length;i++){if(p<a+list[i].dur)return{index:i,seek:p-a};a+=list[i].dur}return{index:0,seek:0}}
function onYouTubeIframeAPIReady(){getVideos().then(v=>{list=v;let total=list.reduce((s,x)=>s+x.dur,0);let live=findV(getLivePos(total));document.getElementById('title').innerText=list[live.index].title;player=new YT.Player('player',{videoId:list[live.index].id,playerVars:{autoplay:1,mute:1,controls:0,rel:0,modestbranding:1,playsinline:1,fs:0,disablekb:1,start:live.seek},events:{onReady:e=>{e.target.seekTo(live.seek,true);e.target.playVideo();},onStateChange:e=>{if(e.data===0)goNext();}}});});}
function goNext(){let total=list.reduce((s,x)=>s+x.dur,0);let live=findV(getLivePos(total));if(player&&player.loadVideoById){player.loadVideoById({videoId:list[live.index].id,startSeconds:live.seek});document.getElementById('title').innerText=list[live.index].title;document.getElementById('playBox').style.display='flex';}}
function playTV(){
try{
player.unMute();
player.setVolume(100);
player.playVideo();
}catch(e){console.log(e);}
document.getElementById('playBox').style.display='none';
}
async function loadAds(){let ads=[];try{let r=await fetch('ads.json?v='+Date.now(),{cache:'no-store'});let d=await r.json();if(Array.isArray(d)&&d.length>0)ads=d;}catch{}if(!ads.length)ads=[{title:'📢 TANGAZA HAPA!',msg:'Watu 1000+ LIVE',contact:'💰 TILL: 3624692'}];let i=0;function show(){let a=ads[i%ads.length];document.getElementById('adT').innerText=a.title;document.getElementById('adM').innerText=a.msg;document.getElementById('adC').innerText=a.contact;i++;}show();setInterval(show,5000);}loadAds();
</script>
</body></html>
