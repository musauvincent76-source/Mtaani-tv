<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTAANI TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden}
#player{width:100vw;height:100vh}
iframe{width:100%;height:100%;border:0}
#info{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#fff;padding:6px 15px;border-radius:20px;font-size:13px;z-index:5}
#watermark{position:fixed;top:12px;right:12px;background:rgba(0,0,0,0.6);color:#fff;padding:4px 10px;border-radius:5px;font-size:11px;z-index:5}
</style>
</head>
<body>
<div id="watermark">WhatsApp: 0751768763</div>
<div id="player"><iframe id="yt" allowfullscreen allow="autoplay"></iframe></div>
<div id="info"><span id="title">Loading...</span></div>
<script>
let videos=[],current=0;
async function load(){
 let r=await fetch('videos.json?t='+Date.now());
 videos=await r.json();
 play(0);
}
function play(i){
 current=i;
 let v=videos[i];
 document.getElementById('title').innerText=(i+1)+'/'+videos.length+' : '+(v.title||'');
 document.getElementById('yt').src='https://www.youtube.com/embed/'+v.id+'?autoplay=1&mute=0&controls=1&rel=0';
}
setInterval(()=>{ if(videos.length>0){ current=(current+1)%videos.length; play(current);} }, 300000);
load();
</script>
</body>
</html>
