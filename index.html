<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTAANI TV LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Arial;height:100vh;display:flex;flex-direction:column}
#topBar{height:36px;background:#111;display:flex;justify-content:space-between;align-items:center;padding:0 12px;color:#fff;font-size:13px;font-weight:bold;flex-shrink:0}
#topBar #logo{color:#ffcc00}
#player{flex:1;background:#000}
iframe{width:100%;height:100%;border:0}
#bottomTicker{height:38px;background:#0a2a8a;display:flex;align-items:center;overflow:hidden;flex-shrink:0}
#bottomTicker span{white-space:nowrap;padding-left:100%;animation:scroll 45s linear infinite;color:#fff;font-weight:bold;font-size:14px;display:inline-block}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
</style>
</head>
<body>
<div id="topBar"><span id="logo">MTAANI TV</span><span id="clock">--:--</span></div>
<div id="player"><iframe id="yt" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
<div id="bottomTicker"><span id="tickerText">MTAANI TV LIVE | Karibu Mtaani! | Tangaza nasi WhatsApp: 0751768763</span></div>
<script>
let videos=[];
async function load(){
 try{let r=await fetch('ticker.json?t='+Date.now());let j=await r.json();if(j.text)document.getElementById('tickerText').innerText=j.text;}catch(e){}
 try{let r=await fetch('videos.json?t='+Date.now());videos=await r.json();playSynced();}catch(e){}
}
function playSynced(){
 if(!videos.length)return;
 let total=videos.reduce((s,v)=>s+(v.duration||300),0);
 let elapsed=Math.floor(Date.now()/1000)%total;
 let acc=0;
 for(let i=0;i<videos.length;i++){
  let d=videos[i].duration||300;
  if(elapsed<acc+d){
   let offset=elapsed-acc;
   document.getElementById('yt').src='https://www.youtube.com/embed/'+videos[i].id+'?autoplay=1&mute=0&controls=0&rel=0&start='+offset;
   setTimeout(playSynced,(d-offset+2)*1000);
   break;
  }
  acc+=d;
 }
}
setInterval(()=>{let d=new Date();document.getElementById('clock').innerText=d.toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'});},1000);
load();
</script>
</body>
</html>
