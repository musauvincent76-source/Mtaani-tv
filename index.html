<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTAANI TV 🔴 LIVE</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
.header{background:#c00;padding:10px;text-align:center;font-weight:bold}
#player{width:100%;aspect-ratio:16/9;background:#000}
.info{padding:12px;background:#111}
.live{color:red;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.ad-box{background:#222;margin:10px 0;padding:8px;text-align:center;border:1px dashed #555}
.desc{color:#ccc;font-size:14px;margin-top:8px}
</style>
</head>
<body>

<div class="header">MTAANI TV <span class="live">🔴 LIVE</span> - <span id="clock"></span></div>

<div id="player"></div>

<div class="info">
  <h3 id="v-title">Inapakia...</h3>
  <div id="v-desc" class="desc"></div>

  <div class="ad-box">
    <!-- WEKA CODE YAKO YA ADSENSE HAPA CHINI -->
    <p style="font-size:12px;color:#888">Adsense itaonekana hapa juu ya description</p>
    <!-- <script> adsense yako </script> -->
  </div>

  <p style="font-size:12px">Watazamaji wote mnaona kitu kimoja same time | Linear TV</p>
</div>

<script>
let videos = [];
let player;
let currentIndex = 0;

async function loadVideos(){
  let res = await fetch('videos.json?t='+Date.now());
  videos = await res.json();
  initPlayer();
}

function getSyncedVideo(){
  let total = videos.reduce((a,b)=>a+b.duration,0);
  let now = Math.floor(Date.now()/1000);
  let daySec = now % 86400; // seconds leo
  let secInLoop = daySec % total;

  let acc=0;
  for(let i=0;i<videos.length;i++){
    if(secInLoop < acc + videos[i].duration){
      return {index:i, seek: secInLoop - acc};
    }
    acc+=videos[i].duration;
  }
  return {index:0, seek:0};
}

function initPlayer(){
  let sync = getSyncedVideo();
  currentIndex = sync.index;
  showInfo(currentIndex);

  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player('player', {
      videoId: videos[currentIndex].id,
      playerVars:{autoplay:1, controls:1, rel:0, modestbranding:1},
      events:{
        'onReady': e=>{
          e.target.seekTo(sync.seek, true);
          e.target.playVideo();
          setTimeout(checkSync, videos[currentIndex].duration*1000 - sync.seek*1000);
        }
      }
    });
  }
}

function showInfo(i){
  document.getElementById('v-title').innerText = videos[i].title;
  document.getElementById('v-desc').innerText = videos[i].desc;
}

function checkSync(){
  let sync = getSyncedVideo();
  currentIndex = sync.index;
  showInfo(currentIndex);
  if(player){
    player.loadVideoById(videos[currentIndex].id, sync.seek);
  }
  setTimeout(checkSync, videos[currentIndex].duration*1000);
}

function updateClock(){
  let n=new Date();
  document.getElementById('clock').innerText=n.toLocaleTimeString();
}
setInterval(updateClock,1000);

loadVideos();
</script>
</body>
</html>
