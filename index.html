<script>
// ===== TRUE LIVE SYNC - KILA MTU ANAONA KITU KIMOJA =====
const START_EPOCH = 1704067200; // Jan 1 2024 00:00:00 - TV ilianza hapa, haiwahi simama
const VIDEO_DURATION = 300; // 5 min kila video - unaweza badilisha

let ytPlayer, playlist=[], currentIdx=0;

async function getPlaylist(){
  try{
    let r=await fetch('videos.json?v='+Date.now());
    let j=await r.json();
    // toa Me at the zoo
    return j.map(v=>({id:v.id||v.ytid, title:v.title||'MTAANI LIVE'})).filter(v=>v.id && v.id!=='jNQXAC9IVRw' && v.id!=='ScMzIvxBSi4');
  }catch(e){ return []; }
}

function getTrueLivePosition(){
  let now = Math.floor(Date.now()/1000);
  let elapsed = now - START_EPOCH;
  let total = playlist.length * VIDEO_DURATION;
  if(total===0) return {idx:0, offset:0};
  let posInLoop = elapsed % total;
  let idx = Math.floor(posInLoop / VIDEO_DURATION);
  let offset = posInLoop % VIDEO_DURATION;
  return {idx, offset};
}

function onYouTubeIframeAPIReady(){
  getPlaylist().then(list=>{
    if(!list.length){
      list=[{id:'dQw4w9WgXcQ', title:'Karibu MTAANI TV - Weka video kwenye videos.json'}];
    }
    playlist=list;
    let pos=getTrueLivePosition();
    currentIdx=pos.idx;
    let video=list[pos.idx];
    document.getElementById('vTitle').innerText=video.title;
    ytPlayer=new YT.Player('player',{
      width:'100%', height:'100%',
      videoId:video.id,
      playerVars:{autoplay:1, mute:1, controls:0, rel:0, modestbranding:1, playsinline:1, iv_load_policy:3, vq:'tiny', start:pos.offset},
      events:{'onReady':e=>{
        e.target.seekTo(pos.offset, true);
        e.target.playVideo();
        document.getElementById('unmute').style.display='block';
        // Update offset kila sekunde ili uone time inaenda
        setInterval(()=>{
          let p=getTrueLivePosition();
          document.getElementById('vTime').innerText=Math.floor(p.offset/60)+':'+String(p.offset%60).padStart(2,'0')+' / 5:00';
        },1000);
      }, 'onStateChange':onState}
    });
  });
}

    if(pos.idx!==currentIdx){
      currentIdx=pos.idx;
