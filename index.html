<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AZAM ALE TV LIVE</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}header{background:#001a4d;padding:12px 16px;display:flex;justify-content:space-between;border-bottom:3px solid #ff6600}header b span{color:#ff6600}.badge{background:#ff0033;padding:4px 10px;border-radius:15px;font-size:10px;font-weight:900;animation:blink 1s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}#playerWrap{flex:1;background:#000;position:relative}#playerWrap iframe{width:100%;height:100%;border:0;position:absolute;top:0;left:0}#unmute{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#ff6600;color:#fff;padding:14px 22px;border-radius:30px;font-weight:900;border:none;z-index:10;box-shadow:0 4px 20px rgba(255,102,0,.6)}.info{padding:10px 16px;background:#0a1430;display:flex;justify-content:space-between}#ticker{height:36px;background:#0a2a8a;display:flex;align-items:center;overflow:hidden;border-top:2px solid #fff}#ticker span{white-space:nowrap;padding-left:100%;animation:scroll 35s linear infinite;font-weight:900;font-size:12px}@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}</style>
</head><body>
<header><b>AZAM <span>ALE TV</span></b><span class="badge">● LIVE</span></header>
<div id="playerWrap"><div id="player"></div><button id="unmute">🔊 WASHA SAUTI</button></div>
<div class="info"><span id="vTitle">Inapakia...</span><span id="vIdx">--/--</span></div>
<div id="ticker"><span>MTAANI TV LIVE | TILL 3624692 | Tuma video yako leo!</span></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player, list=[], cur=0;
const FALLBACK=[
{id:"kJQP7kiw5Fk", title:"Despacito - Mtaani Hit"},
{id:"9bZkp7q19f0", title:"Gangnam Style - Mtaani"},
{id:"3tmd-ClpJxA", title:"Mtaani TV Intro"}
];
async function getList(){
 try{
  let r=await fetch('videos.json?v='+Date.now(),{cache:'no-store'});
  let j=await r.json();
  let f=j.map(v=>({id:(v.id||v.ytid||"").trim(), title:v.title||"MTAANI TV"})).filter(v=>v.id && v.id.length>5 && v.id!=="jNQXAC9IVRw");
  return f.length?f:FALLBACK;
 }catch(e){ return FALLBACK; }
}
function onYouTubeIframeAPIReady(){
 getList().then(l=>{
  list=l; cur=0;
  document.getElementById('vTitle').innerText=list[0].title;
  document.getElementById('vIdx').innerText="1 / "+list.length;
  player=new YT.Player('player',{
   videoId:list[0].id,
   playerVars:{autoplay:1,mute:1,controls:1,rel:0,modestbranding:1,playsinline:1},
   events:{
    onReady:e=>{e.target.playVideo();},
    onStateChange:e=>{
     if(e.data===0){
      cur=(cur+1)%list.length;
      document.getElementById('vTitle').innerText=list[cur].title;
      document.getElementById('vIdx').innerText=(cur+1)+" / "+list.length;
      player.loadVideoById(list[cur].id);
     }
    }
   }
  });
 });
}
document.getElementById('unmute').onclick=function(){player.unMute();player.setVolume(100);this.style.display='none';};
</script>
</body></html>
