<script>
function extractID(t){if(!t)return null;t=t.trim();if(/^[a-zA-Z0-9_-]{11}$/.test(t))return t;let m=t.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/live\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);if(m)return m[1];try{let u=new URL(t);let v=u.searchParams.get('v');if(v&&v.length===11)return v;}catch{}let x=t.match(/[a-zA-Z0-9_-]{11}/);return x?x[0]:null;}
let player,list=[],isLiveMode=false,isPlayNowMode=false,lastVideoId="",_lastIdx=-1,playNowVideo=null;const LOOP_START=new Date('2025-01-01T00:00:00Z').getTime();
async function getVideos(){try{let r=await fetch('videos.json?v='+Date.now(),{cache:'no-store'});let d=await r.json();let f=d.map(v=>{let raw=v.id||v.url||'';let vid=extractID(raw);if(!vid)return null;return{id:vid,raw:raw,dur:parseInt(v.duration)||300,title:v.title||'MTAANI TV'}}).filter(v=>v!==null);if(f.length>0)return f;}catch(e){}return[{id:'4EDkfksVFdE',dur:300,title:'MTAANI TV'}];}
function getLivePos(total){return Math.floor((Date.now()-LOOP_START)/1000)%total}
function findV(pos){let a=0;for(let i=0;i<list.length;i++){if(pos<a+list[i].dur)return{index:i,seek:pos-a,start:a};a+=list[i].dur}return{index:0,seek:0,start:0}}
function playEntry(idx,seek){if(!list[idx])return;try{player.loadVideoById({videoId:list[idx].id,startSeconds:seek||0})}catch{}}
function playPlayNow(v){try{player.loadVideoById({videoId:v.id,startSeconds:0});setTimeout(()=>{try{player.unMute();player.setVolume(100);player.playVideo();var b=document.getElementById('unmuteBtn');if(b) b.style.display='none';}catch{}},1000)}catch{}}
function updateUI(idx){if(!list[idx]||isLiveMode)return;document.getElementById('title').innerText=list[idx].title;document.getElementById('ticker').innerText=list[idx].title.toUpperCase()+" | MTAANI TV TRUE LIVE | TILL 3624692"}
function updateUIFromVideo(v){document.getElementById('title').innerText=v.title;document.getElementById('ticker').innerText=v.title.toUpperCase()+" | MTAANI TV TRUE LIVE | TILL 3624692"}
async function checkLive(){
 try{
  let r=await fetch('live.json?v='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw 'no live';
  let d=await r.json();
  if(d.live){
    startPublicLive(d);
  }else{
    if(isLiveMode) stopPublicLive();
  }
 }catch{
  if(isLiveMode) stopPublicLive();
 }
}
function startPublicLive(data){
 isLiveMode=true;
 document.getElementById('player').style.display='none';
 document.getElementById('liveWrap').style.display='block';
 document.getElementById('liveBadge').style.display='block';
 if(data.bg){
   document.getElementById('liveBg').style.backgroundImage='url('+data.bg+')';
   document.getElementById('liveBg').style.display='block';
 }else{
   document.getElementById('liveBg').style.backgroundImage='';
 }
 if(data.type==='ai-studio'){
   document.getElementById('badge').innerText='● AI LIVE';
   document.getElementById('badge').style.background='#ffcc00';
   document.getElementById('badge').style.color='#000';
   document.getElementById('title').innerText='🤖 AI NEWS LIVE';
   document.getElementById('ticker').innerText=(data.aiText||'MTAANI TV AI LIVE').toUpperCase()+' | TILL 3624692';
   document.getElementById('count').innerText='AI LIVE';
   document.getElementById('pbar').style.width='100%';
   document.getElementById('ptext').innerText='AI LIVE';
   document.getElementById('liveBadge').innerText='🤖 AI LIVE';
   document.getElementById('liveVdo').style.display='none';
   document.getElementById('aiView').style.display='flex';
   document.getElementById('aiText').innerText=data.aiText||'MTAANI TV AI LIVE';
   if(data.permanent && data.permanent.length>0){
     let last=data.permanent[data.permanent.length-1];
     if(last.type && last.type.startsWith('video')){
       let v=document.getElementById('aiCity');
       v.style.display='block';
       v.src=last.data;
       v.play().catch(()=>{});
     }else if(last.data){
       document.getElementById('liveBg').style.backgroundImage='url('+last.data+')';
     }
   }
   return;
 }
 let viewUrl = data.vdo_view || data.view || (data.room? 'https://vdo.ninja/?view='+data.room+'&cleanoutput&transparent&noheader' : '');
 if(!viewUrl){
   stopPublicLive();
   return;
 }
 document.getElementById('badge').innerText='● TRUE LIVE 3HRS';
 document.getElementById('badge').style.background='#00b300';
 document.getElementById('badge').style.color='#fff';
 document.getElementById('title').innerText='🔴 TRUE LIVE - WOTE PAMOJA';
 document.getElementById('ticker').innerText='🔴 TRUE LIVE - WOTE PAMOJA - 3HRS | TILL 3624692';
 document.getElementById('count').innerText='LIVE 3HRS';
 document.getElementById('pbar').style.width='100%';
 document.getElementById('ptext').innerText='LIVE';
 document.getElementById('liveBadge').innerText='🔴 TRUE LIVE';
 document.getElementById('aiView').style.display='none';
 document.getElementById('liveVdo').style.display='block';
 document.getElementById('liveVdo').innerHTML='<iframe src="'+viewUrl+'" allow="camera;microphone;fullscreen;display-capture;autoplay" allowfullscreen></iframe>';
}
function stopPublicLive(){
 isLiveMode=false;
 document.getElementById('player').style.display='block';
 document.getElementById('liveWrap').style.display='none';
 document.getElementById('liveBadge').style.display='none';
 document.getElementById('liveVdo').innerHTML='';
 document.getElementById('aiView').style.display='none';
 document.getElementById('badge').innerText='● LIVE';
 document.getElementById('badge').style.background='red';
 document.getElementById('badge').style.color='#fff';
 if(player&&list.length>0){
   let total=list.reduce((s,x)=>s+x.dur,0);
   let live=findV(getLivePos(total));
   try{playEntry(live.index,live.seek)}catch{}
 }
}
async function checkNewVideos(){if(isLiveMode)return;try{let newList=await getVideos();if(newList.length===0)return;if(!lastVideoId){lastVideoId=newList[0].raw;list=newList;return}let newFirst=newList[0].raw;if(newFirst!==lastVideoId){list=newList;lastVideoId=newFirst;playNowVideo=newList[0];isPlayNowMode=true;document.getElementById('playNowBadge').style.display='block';document.getElementById('playNowBadge').innerText='▶️ PLAY NOW: '+playNowVideo.title.substring(0,25);document.getElementById('count').innerText='PLAY NOW';updateUIFromVideo(playNowVideo);if(player)playPlayNow(playNowVideo)}else{if(isPlayNowMode)return;list=newList}}catch(e){}}
function unmuteNow(){try{if(player){player.unMute();player.setVolume(100);player.playVideo();}var b=document.getElementById('unmuteBtn');if(b) b.style.display='none';}catch{}}
function onYouTubeIframeAPIReady(){getVideos().then(v=>{list=v;if(list.length>0)lastVideoId=list[0].raw;let total=list.reduce((s,x)=>s+x.dur,0);let live=findV(getLivePos(total));_lastIdx=live.index;updateUI(live.index);document.getElementById('count').innerText='LIVE';player=new YT.Player('player',{playerVars:{autoplay:1,mute:1,controls:0,rel:0,modestbranding:1,playsinline:1,fs:0,disablekb:1,vq:'small'},events:{onReady:e=>{playEntry(live.index,live.seek);},onError:e=>{document.getElementById('ptext').innerText='SKIPPING...';setTimeout(()=>{goNext()},800)},onStateChange:e=>{if(e.data===0){if(isPlayNowMode){isPlayNowMode=false;playNowVideo=null;document.getElementById('playNowBadge').style.display='none';let total=list.reduce((s,x)=>s+x.dur,0);let live=findV(getLivePos(total));_lastIdx=live.index;updateUI(live.index);document.getElementById('count').innerText='LIVE';playEntry(live.index,live.seek);return}if(!isLiveMode)goNext()}}}});setInterval(()=>{if(isLiveMode){document.getElementById('pbar').style.width='100%';document.getElementById('ptext').innerText='LIVE';return}if(isPlayNowMode){try{let curT=player.getCurrentTime();let durT=player.getDuration();if(durT>0){let pct=Math.floor((curT/durT)*100);document.getElementById('pbar').style.width=pct+'%';document.getElementById('ptext').innerText='PLAY NOW '+pct+'%'}}catch{}return}try{let curT=player.getCurrentTime();let durT=player.getDuration();if(durT>0){let idx=_lastIdx>=0?_lastIdx:0;if(list[idx])list[idx].dur=Math.floor(durT);let pct=Math.floor((curT/durT)*100);if(pct>=0&&pct<=100){document.getElementById('pbar').style.width=pct+'%';document.getElementById('ptext').innerText=pct+'%'}} }catch{}},1000);setInterval(checkLive,4000);setInterval(checkNewVideos,3000);checkLive()});}
function goNext(){if(isLiveMode||isPlayNowMode)return;try{_lastIdx++;if(_lastIdx>=list.length)_lastIdx=0;playEntry(_lastIdx,0);updateUI(_lastIdx);document.getElementById('count').innerText='LIVE';}catch(e){setTimeout(goNext,1000)}}
function updateClock(){let now=new Date();document.getElementById('clock').innerText=String(now.getHours()).padStart(2,'0')+":"+String(now.getMinutes()).padStart(2,'0')+":"+String(now.getSeconds()).padStart(2,'0')}setInterval(updateClock,1000);updateClock();
document.addEventListener('click',()=>{unmuteNow()});
document.addEventListener('touchstart',()=>{unmuteNow()},{once:true});
async function loadAds(){let ads=[];try{let r=await fetch('ads.json?v='+Date.now(),{cache:'no-store'});let d=await r.json();if(Array.isArray(d)&&d.length>0)ads=d}catch{}if(!ads.length)ads=[{title:'📢 TANGAZA HAPA!',msg:'Watu 1000+ LIVE',contact:'💰 TILL: 3624692'}];let i=0;function show(){let a=ads[i%ads.length];document.getElementById('adT').innerText=a.title;document.getElementById('adM').innerText=a.msg;document.getElementById('adC').innerText=a.contact;i++}show();setInterval(show,5000)}loadAds();
</script>
