<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZAM ALE TV LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:#001a4d;padding:12px 16px;display:flex;justify-content:space-between;border-bottom:3px solid #ff6600}
header b span{color:#ff6600}
.badge{background:#ff0000;padding:5px 10px;border-radius:15px;font-size:10px;font-weight:900;animation:b 1s infinite}
@keyframes b{0%,100%{opacity:1}50%{opacity:.5}}
#wrap{flex:1;position:relative;background:#000}
#wrap iframe{width:100%;height:100%;border:0;position:absolute;top:0;left:0}
#mute{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#ff6600;color:#fff;padding:14px 22px;border-radius:30px;border:none;font-weight:900;z-index:10}
.bar{padding:10px 16px;background:#0a1430;display:flex;justify-content:space-between;font-size:13px}
#tick{height:36px;background:#0a2a8a;display:flex;align-items:center;overflow:hidden;border-top:2px solid #fff}
#tick span{white-space:nowrap;padding-left:100%;animation:s 40s linear infinite;font-weight:900}
@keyframes s{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
</style>
</head>
<body>
<header><b>AZAM <span>ALE TV</span></b><span class="badge">● LIVE</span></header>
<div id="wrap"><div id="player"></div><button id="mute">🔊 WASHA SAUTI</button></div>
<div class="bar"><span id="title">Inapakia 4 videos...</span><span id="count">0/4</span></div>
<div id="tick"><span>AZAM ALE TV MTAANI | TILL 3624692 | Iko na 4 video - Inacheza 90% kisha inaruka!</span></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player, list=[], cur=0;
async function getVideos(){
  try{
    let r=await fetch('videos.json?v='+Date.now(),{cache:'no-store'});
    let data=await r.json();
    return data.map(v=>({id:(v.id||v.ytid||'').trim(), title:v.title||'MTAANI'})).filter(v=>v.id.length>5);
  }catch{return [];}
}
function onYouTubeIframeAPIReady(){
  getVideos().then(v=>{
    list=v;
    if(!list.length){document.getElementById('title').innerText='Weka video 4 kwenye admin';return;}
    cur=0;
    document.getElementById('title').innerText=list[0].title;
    document.getElementById('count').innerText='1/'+list.length;
    player=new YT.Player('player',{
      videoId:list[0].id,
      playerVars:{autoplay:1,mute:1,controls:1,rel:0,modestbranding:1,playsinline:1},
      events:{
        onReady:e=>{
          e.target.playVideo();
          // HII NDIO SIRI YA 90% - hakuna kurudisha nyuma!
          setInterval(()=>{
            try{
              let d=player.getDuration(), t=player.getCurrentTime();
              if(d>0 && t/d>=0.90){ goNext(); }
            }catch{}
          },2000);
        },
        onStateChange:e=>{ if(e.data===0) goNext(); }
      }
    });
  });
}
function goNext(){
  cur=(cur+1)%list.length;
  document.getElementById('title').innerText=list[cur].title;
  document.getElementById('count').innerText=(cur+1)+'/'+list.length;
  player.loadVideoById(list[cur].id);
}
document.getElementById('mute').onclick=function(){player.unMute();player.setVolume(100);this.style.display='none';}
</script>
</body>
 </html>
