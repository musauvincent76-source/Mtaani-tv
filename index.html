<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MTAANI TV LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Arial Black, Arial;font-weight:900;height:100vh;display:flex;flex-direction:column;touch-action:pan-y}
#topBar{height:48px;background:#000;display:flex;justify-content:space-between;align-items:center;padding:0 14px;flex-shrink:0;border-bottom:2px solid #ffcc00}
#topBar #logo{color:#ffcc00;font-size:20px;letter-spacing:1.5px;text-shadow:0 0 5px #ffcc00, 2px 2px 0 #000;font-weight:900}
#topBar #clock{color:#fff;font-size:18px;font-weight:900;letter-spacing:1px;text-shadow:1px 1px 2px #000}
#player{flex:1;background:#000;overflow:hidden}
iframe{width:100%;height:100%;border:0}
#bottomTicker{height:42px;background:#0a2a8a;display:flex;align-items:center;overflow:hidden;flex-shrink:0;border-top:2px solid #fff}
#bottomTicker span{white-space:nowrap;padding-left:100%;animation:scroll 40s linear infinite;color:#fff;font-weight:900;font-size:16px;display:inline-block;letter-spacing:0.5px}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
</style>
</head>
<body>
<div id="topBar"><span id="logo">MTAANI TV</span><span id="clock">00:00:00</span></div>
<div id="player"><iframe id="yt" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
<div id="bottomTicker"><span id="tickerText">MTAANI TV LIVE | Karibu Mtaani! | WhatsApp: 0751768763</span></div>
<script>
let videos=[];
async function load(){
 try{let r=await fetch('ticker.json?t='+Date.now());let j=await r.json();if(j.text)document.getElementById('tickerText').innerText=j.text;}catch(e){}
 try{let r=await fetch('videos.json?t='+Date.now());videos=await r.json();playSynced();}catch(e){}
}
function playSynced(){
 if(!videos.length)return;
 let total=videos.reduce((s,v)=>s+(v.duration||300),0);
 let elapsed=Math.floor(Date.now()/1000)%total;
 let acc=0;
 for(let i=0;i<videos.length;i++){
  let d=videos[i].duration||300;
  if(elapsed<acc+d){
   let offset=elapsed-acc;
   document.getElementById('yt').src='https://www.youtube.com/embed/'+videos[i].id+'?autoplay=1&mute=0&controls=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&start='+offset;
   setTimeout(playSynced,(d-offset+2)*1000);
   break;
  }
  acc+=d;
 }
}
setInterval(()=>{let d=new Date();document.getElementById('clock').innerText=d.toLocaleTimeString('en-KE',{hour12:false});},1000);
load();
</script>
</body>
                  </html>
