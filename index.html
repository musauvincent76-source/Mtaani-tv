<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZAM ALE TV TRUE LIVE</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}header{background:#001a4d;padding:12px 16px;display:flex;justify-content:space-between;border-bottom:3px solid #ff6600}header b span{color:#ff6600}.live{background:red;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:900;animation:b 1s infinite}@keyframes b{0%,100%{opacity:1}50%{opacity:.4}}#tv{flex:1;position:relative;background:#000}#tv #player{width:100%;height:100%;position:absolute;top:0;left:0}#tap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#ff6600;color:#fff;padding:12px 24px;border-radius:30px;border:2px solid #fff;font-weight:900;z-index:20}#info{padding:10px 16px;background:#0a1430;display:flex;justify-content:space-between;font-size:13px}#tick{height:36px;background:#0a2a8a;display:flex;align-items:center;overflow:hidden;border-top:2px solid #fff}#tick span{white-space:nowrap;animation:s 30s linear infinite;font-weight:900;padding-left:100%}@keyframes s{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}</style>
</head><body>
<header><b>AZAM <span>ALE TV</span></b><span class="live">● TRUE LIVE</span></header>
<div id="tv"><div id="player"></div><button id="tap" onclick="unmute()">🔊 WASHA SAUTI</button></div>
<div id="info"><span id="title">TRUE LIVE - Loading...</span><span id="count">LIVE 24/7</span></div>
<div id="tick"><span>AZAM ALE TV MTAANI | TILL 3624692 | TRUE LIVE - Ukitoka ukirudi itakuwa imeendelea mbele, sio kuanza upya!</span></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player, list=[];
const START_TIME = new Date('2025-01-01T00:00:00Z').getTime(); // TV ilianza hapa

async function getVideos(){
 try{
  let r=await fetch('videos.json?v='+Date.now(),{cache:'no-store'});
  let d=await r.json();
  return d.map(v=>({id:(v.id||'').trim(), title:v.title||'MTAANI TV', dur:300})).filter(v=>v.id.length>8);
 }catch{return [];}
}
function getLivePosition(totalDuration){
 let now = Date.now();
 let elapsed = Math.floor((now - START_TIME)/1000);
 return elapsed % totalDuration;
}
function findCurrent(pos){
 let acc=0;
 for(let i=0;i<list.length;i++){
  if(pos < acc + list[i].dur) return {index:i, seek: pos - acc};
  acc+=list[i].dur;
 }
 return {index:0, seek:0};
}

function onYouTubeIframeAPIReady(){
 getVideos().then(v=>{
  list = v.length? v : [
   {id:'4EDkfksVFdE',title:'MTAANI 1',dur:300},
   {id:'kHc8ELzuIKM',title:'MTAANI 2',dur:300},
   {id:'HAQCI_JrycQ',title:'MTAANI 3',dur:300},
   {id:'QXm2HdKdZkQ',title:'MTAANI 4',dur:300}
  ];
  let total = list.reduce((s,x)=>s+x.dur,0);
  let livePos = getLivePosition(total);
  let cur = findCurrent(livePos);

  document.getElementById('title').innerText = list[cur.index].title + ' - LIVE '+(cur.index+1)+'/'+list.length;
  document.getElementById('count').innerText = (cur.index+1)+'/'+list.length;

  player = new YT.Player('player',{
   videoId: list[cur.index].id,
   playerVars:{autoplay:1,mute:1,controls:1,rel:0,modestbranding:1,playsinline:1,start:cur.seek},
   events:{
    onReady:(e)=>{
     e.target.seekTo(cur.seek,true);
     e.target.playVideo();
     // Check kila 3 sec kama imefika 90% ndio iruke kwa LIVE position mpya
     setInterval(()=>{
      try{
       let d=player.getDuration(), t=player.getCurrentTime();
       if(d>30 && t/d >= 0.90){
        let newTotal = list.reduce((s,x)=>s+x.dur,0);
        let newPos = getLivePosition(newTotal);
        let next = findCurrent(newPos);
        document.getElementById('title').innerText = list[next.index].title + ' - LIVE '+(next.index+1)+'/'+list.length;
        player.loadVideoById({videoId:list[next.index].id, startSeconds:next.seek});
       }
      }catch{}
     },3000);
    },
    onStateChange:(e)=>{ if(e.data===0){
      let newTotal = list.reduce((s,x)=>s+x.dur,0);
      let newPos = getLivePosition(newTotal);
      let next = findCurrent(newPos);
      player.loadVideoById({videoId:list[next.index].id, startSeconds:next.seek});
    }}
   }
  });
 });
}
function unmute(){ player.unMute(); player.setVolume(100); document.getElementById('tap').style.display='none'; }
</script>
</body></html>
