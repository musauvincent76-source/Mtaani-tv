<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTAANI TV LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Arial}
#topSpace{height:30vh;background:#000}
#tvBox{height:70vh;background:#000;display:flex;flex-direction:column}
#player{flex:1;background:#000}
iframe{width:100%;height:100%;border:0}
#bottomTicker{
 height:38px;background:#cc0000;
 display:flex;align-items:center;overflow:hidden;
 flex-shrink:0;
}
#bottomTicker span{
 white-space:nowrap;display:inline-block;
 padding-left:100%;animation:scroll 35s linear infinite;
 font-weight:bold;font-size:15px;color:#fff;
}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
</style>
</head>
<body>
<div id="topSpace"></div>
<div id="tvBox">
  <div id="player"><iframe id="yt" allowfullscreen allow="autoplay"></iframe></div>
  <div id="bottomTicker"><span id="tickerText">MTAANI TV LIVE | Tuma video / matangazo WhatsApp: 0751768763</span></div>
</div>
<script>
let videos=[];
async function load(){
 try{let r=await fetch('ticker.json?t='+Date.now());let j=await r.json();if(j.text)document.getElementById('tickerText').innerText=j.text;}catch(e){}
 try{let r=await fetch('videos.json?t='+Date.now());videos=await r.json();playSynced();}catch(e){}
}
function playSynced(){
 if(!videos.length)return;
 let total=videos.reduce((s,v)=>s+(v.duration||300),0);
 let elapsed=Math.floor(Date.now()/1000)%total;
 let acc=0;
 for(let i=0;i<videos.length;i++){
  let d=videos[i].duration||300;
  if(elapsed<acc+d){
   let offset=elapsed-acc;
   document.getElementById('yt').src='https://www.youtube.com/embed/'+videos[i].id+'?autoplay=1&mute=0&controls=0&start='+offset;
   setTimeout(playSynced,(d-offset+1)*1000);
   break;
  }
  acc+=d;
 }
}
let colors=['#cc0000','#0033cc','#ffcc00'];let ci=0;
setInterval(()=>{
 ci=(ci+1)%colors.length;
 let t=document.getElementById('bottomTicker');
 t.style.background=colors[ci];
 document.querySelector('#bottomTicker span').style.color=colors[ci]=='#ffcc00'?'#000':'#fff';
},2500);
load();
</script>
</body>
</html>
