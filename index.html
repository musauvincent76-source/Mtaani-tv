<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZAM ALE TV</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}header{background:#001a4d;padding:12px 16px;display:flex;justify-content:space-between;border-bottom:3px solid #ff6600}header b span{color:#ff6600}.badge{background:red;padding:4px 10px;border-radius:15px;font-size:10px;font-weight:900} #playerWrap{flex:1;background:#000;position:relative}#playerWrap iframe{width:100%;height:100%;border:0;position:absolute;top:0;left:0}#unmute{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#ff6600;color:#fff;padding:14px 22px;border-radius:30px;font-weight:900;border:none;z-index:10}.info{padding:10px 16px;background:#0a1430;display:flex;justify-content:space-between;font-size:13px}#ticker{height:36px;background:#0a2a8a;display:flex;align-items:center;overflow:hidden;border-top:2px solid #fff}#ticker span{white-space:nowrap;padding-left:100%;animation:scroll 35s linear infinite;font-weight:900}@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}</style>
</head><body>
<header><b>AZAM <span>ALE TV</span></b><span class="badge">● LIVE 90%</span></header>
<div id="playerWrap"><div id="player"></div><button id="unmute">🔊 WASHA SAUTI</button></div>
<div class="info"><span id="vTitle">Inapakia...</span><span id="vCount">--/--</span></div>
<div id="ticker"><span>MTAANI TV LIVE | TILL 3624692 | Iko na 4 video - Inacheza 90% na kuruka!</span></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player,list=[],cur=0;
async function getList(){
 try{
  let r=await fetch('videos.json?v='+Date.now(),{cache:'no-store'});
  let j=await r.json();
  let f=j.map(v=>({id:(v.id||v.ytid||"").trim(),title:v.title||"MTAANI TV"})).filter(v=>v.id&&v.id.length>5&&v.id!=="jNQXAC9IVRw");
  return f;
 }catch(e){return [];}
}
function onYouTubeIframeAPIReady(){
 getList().then(l=>{
  list=l;
  if(!l.length){document.getElementById('vTitle').innerText="Weka video kwenye videos.json";return;}
  cur=0;
  document.getElementById('vTitle').innerText=list[cur].title;
  document.getElementById('vCount').innerText="1/"+list.length;
  player=new YT.Player('player',{
   videoId:list[cur].id,
   playerVars:{autoplay:1,mute:1,controls:1,rel:0,modestbranding:1,playsinline:1},
   events:{
    onReady:e=>{
     e.target.playVideo();
     setInterval(()=>{
      try{
       let d=player.getDuration(), t=player.getCurrentTime();
       if(d>0&&t/d>=0.90){ next(); }
      }catch{}
     },2000);
    },
    onStateChange:e=>{ if(e.data===0){ next(); } }
   }
